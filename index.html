white}.light{background:white;color:var(--g)}.clay{background:var(--c);color:white}.grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.pcard{height:470px;border-radius:26px;overflow:hidden;position:relative;color:white;box-shadow:var(--sh);transition:.3s}.pcard:hover{transform:translateY(-7px)}.pcard img{width:100%;height:100%;object-fit:cover;object-position:top}.pcard:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 25%,#00201818 48%,#00170feb)}.ptext{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:24px}.ptext h2{font-size:34px;line-height:.95;text-transform:uppercase;margin:10px 0}.star{color:var(--b);font-weight:900}.ball{position:absolute;right:17px;top:17px;z-index:3;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--b);color:var(--g);font-weight:950;box-shadow:0 7px 18px #0005}.quizbox{position:relative;z-index:2;max-width:850px;margin:auto;background:#fffef6f2;border-radius:30px;padding:clamp(20px,5vw,52px);box-shadow:var(--sh)}.meta{display:flex;justify-content:space-between;color:var(--m);font-size:11px;text-transform:uppercase;font-weight:900}.progress{height:8px;background:#ddd;border-radius:99px;margin:14px 0 28px;overflow:hidden}.progress i{display:block;height:100%;background:var(--c)}.q{font:700 clamp(30px,5vw,50px)/1.05 Georgia;color:var(--g);margin:14px 0 25px}.answers{display:grid;gap:10px}.ans{border:1.5px solid #d8ddd8;border-radius:16px;background:white;padding:13px 15px;display:flex;align-items:center;gap:14px;text-align:left}.ans.sel{background:#f2dbcf;border-color:var(--c)}.aball{width:38px;height:38px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--b);color:var(--g);font-weight:950}.exchange{height:90px;position:relative;overflow:hidden;margin:-5px 0 4px}.racket{position:absolute;left:-90px;top:5px;font-size:65px;transform:rotate(35deg)}.shot{position:absolute;left:52px;top:35px;width:25px;height:25px;border-radius:50%;background:var(--b)}.exchange.play .racket{animation:swing .65s ease}.exchange.play .shot{animation:fly .75s ease forwards}@keyframes swing{0%{left:-90px;transform:rotate(60deg)}45%{left:5px;transform:rotate(-20deg)}100%{left:-30px;transform:rotate(25deg)}}@keyframes fly{0%{left:55px;top:35px}50%{top:4px}100%{left:110%;top:42px}}.qnav{display:flex;justify-content:space-between;margin-top:22px}.result{background:radial-gradient(circle at 88% 45%,#ffffff10 0 14%,transparent 14.5%),linear-gradient(110deg,#052f24ee,#71321ee8),url('https://upload.wikimedia.org/wikipedia/commons/thumb/c/c3/Coupe_des_Mousquetaires_%28French_Open_-_Gentlemen%27s_single%29.svg/960px-Coupe_des_Mousquetaires_%28French_Open_-_Gentlemen%27s_single%29.svg.png');background-repeat:no-repeat;background-size:cover,cover,45%;background-position:center,center,98% center;padding:55px 5vw}.atpcard{max-width:1050px;margin:auto;display:grid;grid-template-columns:.8fr 1.2fr;background:white;border:6px solid #d3b160;border-radius:28px;overflow:hidden;box-shadow:0 38px 110px #0008;animation:deal .8s cubic-bezier(.2,.9,.2,1)}@keyframes deal{from{opacity:0;transform:perspective(1000px) rotateY(-17deg) scale(.9)}to{opacity:1;transform:none}}.photo{min-height:650px;position:relative;background:var(--g)}.photo img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:top}.info{padding:45px;position:relative;background:linear-gradient(135deg,#fff,#f3ecde)}.info:before{content:"ATP STYLE";position:absolute;right:18px;top:18px;color:#073c2d20;font:900 58px Georgia}.info h1{font-size:clamp(48px,7vw,82px);line-height:.88;color:var(--g);text-transform:uppercase;margin:12px 0}.motto{color:var(--c);font:italic 21px Georgia}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:white;border:1px solid #ddd4c5;border-left:5px solid var(--c);padding:14px;border-radius:12px}.prompt{background:var(--g);color:white;padding:16px;border-radius:15px;margin-top:14px}.sheetpage,.roompage{background:linear-gradient(#073c2ddc,#073c2df0),url('https://commons.wikimedia.org/wiki/Special:FilePath/Court%20Philippe-Chatrier%2012.jpg');background-size:cover;background-position:center}.sheet,.room{position:relative;z-index:2;max-width:1100px;margin:auto;background:#fffef3ed;border:4px solid #d3b160;border-radius:28px;box-shadow:var(--sh);overflow:hidden}.sheethero{display:grid;grid-template-columns:320px 1fr;background:linear-gradient(110deg,var(--g),var(--g2));color:white}.sheethero img{width:100%;height:380px;object-fit:cover;object-position:top}.sheetcopy{padding:35px}.sheetcopy h1{font-size:60px;text-transform:uppercase;margin:8px 0}.sheetbody{padding:28px;display:grid;grid-template-columns:1fr 1fr;gap:15px}.box,.panel,.kpi{background:#fff;border:1px solid #ded6c7;border-radius:15px;padding:17px}.box h3,.panel h3{color:var(--g);text-transform:uppercase}.room{padding:28px}.roomtitle{color:var(--g);font-size:58px;text-transform:uppercase;margin:0}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.kpi b{display:block;font:900 36px Georgia;color:var(--g)}.roomgrid{display:grid;grid-template-columns:1.15fr .85fr;gap:15px}.bar{display:grid;grid-template-columns:145px 1fr 35px;gap:10px;align-items:center;margin:11px 0}.track{height:15px;background:#eee7db;border-radius:99px;overflow:hidden}.track i{display:block;height:100%}.foot{padding:20px;text-align:center;background:var(--g);color:#ffffff99;font-size:11px}

</style></head><body><header class="top"><div class="brand"><img class="logo" alt="Logo FFT" src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20F%C3%A9d%C3%A9ration%20fran%C3%A7aise%20de%20tennis.svg"><span>Profils enseignants</span></div><button id="mb" class="menub">Menu</button><nav id="nav" class="nav"><button data-v="profiles">Profils</button><button data-v="quiz">Questionnaire</button><button data-v="sheet">Ma fiche</button><button data-v="room">La salle</button></nav></header><main id="app"></main><footer class="foot">Prototype d'animation. Les profils sont des repères de discussion, pas une évaluation.</footer><script>
const P={P:{n:'Le Passeur',s:'Yannick Noah',f:'court',im:'https://commons.wikimedia.org/wiki/Special:FilePath/Yannick%20Noah%20%28Roland%20Garros%202023%29%2001.jpg',m:"Ma fierté, c’est de les voir progresser.",d:"Vous vivez pour le déclic d’un joueur et la progression du groupe.",fo:['Pédagogie','Patience','Animation'],pa:['Groupes hétérogènes','Préparation','Suivi individuel'],pr:"Prépare une séance d’une heure pour huit enfants, niveau orange, objectif service."},C:{n:'Le Coach de compétition',s:'Novak Djokovic',f:'court',im:'https://commons.wikimedia.org/wiki/Special:FilePath/Novak%20Djokovic%20French%20Open%202015.jpg',m:'Chaque détail peut faire progresser.',d:'Vous recherchez la précision, la progression mesurable et la performance.',fo:['Expertise technique','Analyse tactique','Exigence'],pa:['Individualiser','Analyser','Planifier'],pr:'Analyse mes notes de match et propose trois axes de travail.'},B:{n:'Le Bâtisseur',s:'Amélie Mauresmo',f:'club',im:'https://fr.wikipedia.org/wiki/Special:FilePath/Am%C3%A9lie%20Mauresmo%20%28cropped%29.jpg',m:'Je fais avancer le projet du club.',d:'Vous coordonnez les personnes, les priorités et les projets collectifs.',fo:["Vision d’ensemble",'Organisation','Coordination'],pa:['Administratif','Attentes multiples','Priorisation'],pr:'Transforme ces informations en plan d’action avec étapes et responsables.'},E:{n:"L’Entrepreneur",s:'Serena Williams',f:'club',im:'https://commons.wikimedia.org/wiki/Special:FilePath/Serena%20Williams%20at%202013%20US%20Open.jpg',m:'Une idée utile devient une offre claire.',d:'Vous développez les offres et la relation avec vos publics.',fo:['Autonomie','Service','Création'],pa:['Créneaux','Communication','Suivi'],pr:'Crée trois offres de stage pour adultes débutants.'},J:{n:'Le Jeune Pro',s:'Carlos Alcaraz',f:'traj',im:'https://upload.wikimedia.org/wikipedia/commons/5/5f/Carlos_Alcaraz_2025_FO.jpg',m:'J’apprends en testant.',d:'Curieux et connecté, vous construisez votre style en expérimentant.',fo:['Énergie','Curiosité','Numérique'],pa:['Répertoire','Situations difficiles','Temps'],pr:'Propose cinq variantes progressives d’un exercice de service.'},S:{n:'Le Sage',s:'Roger Federer',f:'traj',im:'https://commons.wikimedia.org/wiki/Special:FilePath/Roger%20Federer%202012%20Indian%20Wells.jpg',m:'L’expérience aide à aller à l’essentiel.',d:'Vous privilégiez les repères solides, la simplicité et la transmission.',fo:['Expérience','Recul','Transmission'],pa:['Outils complexes','Paperasse','Formalisation'],pr:'Transforme ma description orale en fiche pédagogique claire.'}};const K=Object.keys(P),F={court:'#c55b32',club:'#315d98',traj:'#16805a'};const Q=[['Votre meilleur moment ?',[['Un joueur progresse','P'],['Un résultat en match','C'],['Un projet avance','B'],['Une activité se remplit','E'],['Une séance nouvelle fonctionne','J'],['Un conseil est transmis','S']]],['Ce qui prend le plus de temps ?',[["Préparer",'P'],['Analyser','C'],['Coordonner','B'],['Communiquer','E'],['Se former','J'],['La paperasse','S']]],['Votre légitimité vient de…',[["Ma pédagogie",'P'],['Mon expertise','C'],['Mon organisation','B'],['Ma relation public','E'],["Mon envie d’apprendre",'J'],['Mon expérience','S']]],['Votre public préféré ?',[["Groupes de jeunes",'P'],['Compétiteurs','C'],['Tout le club','B'],['Adultes et stages','E'],['Publics variés','J'],['Pratiquants fidèles','S']]],['Avec deux heures libres…',[["Inventer des jeux",'P'],['Analyser des matchs','C'],['Avancer un projet','B'],['Créer une offre','E'],['Tester un outil','J'],['Formaliser le savoir','S']]],['Votre parcours ?',[["Je débute",'J'],['Je construis mon style','P'],["J’ai des responsabilités",'B'],["J’ai une longue expérience",'S']]],['Face à un nouvel outil…',[["Je teste pour mes élèves",'P'],['Je demande des preuves','C'],['Je regarde le collectif','B'],['Je mesure la valeur','E'],['Je fonce','J'],['Je veux du simple','S']]],['Votre devise ?',[["Chacun progresse",'P'],['Les détails comptent','C'],['Un projet rassemble','B'],['Une idée devient action','E'],['On apprend en essayant','J'],["L’expérience compte",'S']]],['Votre usage IA ?',[["Jamais",'P'],['Testé','J'],['Ponctuel','B'],['Chaque semaine','C'],['Très fréquent','E']]],['Quel usage IA ?',[["Adapter les séances",'P'],['Analyser la progression','C'],['Piloter un projet','B'],['Créer des communications','E'],['Trouver des idées','J'],['Formaliser mon savoir','S']]]];
const st={v:location.hash.slice(1)||'profiles',i:0,a:Array(Q.length).fill(null),r:JSON.parse(localStorage.getItem('res')||'null'),room:JSON.parse(localStorage.getItem('room')||'[]')},app=document.getElementById('app'),nav=document.getElementById('nav');function go(v){st.v=v;location.hash=v;nav.classList.remove('open');render();scrollTo(0,0)}function profiles(){return `<section class="view profiles"><div class="head"><div><b>PROFILS ENSEIGNANTS FFT</b><h1>Entrez dans le jeu</h1><p>Six univers, six personnalités du tennis, six manières d’exercer le métier.</p></div><button class="btn dark" data-go="quiz">Commencer →</button></div><div class="grid">${K.map(k=>`<article class="pcard"><img src="${P[k].im}" onerror="this.onerror=null;this.src='https://upload.wikimedia.org/wikipedia/commons/5/5f/Carlos_Alcaraz_2025_FO.jpg'"><span class="ball">${k}</span><div class="ptext"><b style="color:${F[P[k].f]}">${P[k].f.toUpperCase()}</b><h2>${P[k].n}</h2><div class="star">Esprit ${P[k].s}</div><p>« ${P[k].m} »<br>${P[k].d}</p></div></article>`).join('')}</div></section>`}function quiz(){let q=Q[st.i],sel=st.a[st.i],L='ABCDEF';return `<section class="view quiz"><div class="quizbox"><div class="meta"><span>Question ${st.i+1}/10</span><span>Échange en cours</span></div><div class="progress"><i style="width:${(st.i+(sel!=null?1:0))*10}%"></i></div><div id="ex" class="exchange"><span class="racket">🎾</span><span class="shot"></span></div><div class="q">${q[0]}</div><div class="answers">${q[1].map((x,i)=>`<button class="ans ${sel===i?'sel':''}" data-a="${i}"><span class="aball">${L[i]}</span>${x[0]}</button>`).join('')}</div><div class="qnav"><button class="btn light" data-prev>← Précédent</button><button class="btn clay" data-next ${sel==null?'disabled':''}>${st.i===9?'Révéler ma carte':'Frapper la balle →'}</button></div></div></section>`}function calc(){let s=Object.fromEntries(K.map(k=>[k,0]));st.a.forEach((a,i)=>{if(a!=null)s[Q[i][1][a][1]]++});let o=K.sort((a,b)=>s[b]-s[a]);return {p:o[0],sec:o[1]}}function result(){let k=st.r.p,p=P[k];return `<section class="view result"><article class="atpcard"><div class="photo"><img src="${p.im}"></div><div class="info"><small>FFT PLAYER CARD · PROFIL DOMINANT</small><h1>${p.n}</h1><div class="motto">« ${p.m} »</div><p>${p.d}</p><div class="stats"><div class="stat"><b>Personnalité miroir</b>${p.s}</div><div class="stat"><b>Profil secondaire</b>${P[st.r.sec].n}</div><div class="stat"><b>Forces</b>${p.fo.join(' · ')}</div><div class="stat"><b>Vigilances</b>${p.pa.join(' · ')}</div></div><div class="prompt"><b>PROMPT SIGNATURE</b><p>${p.pr}</p></div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:18px"><button class="btn dark" data-go="sheet">Ma fiche</button><button class="btn light" data-go="room">La salle</button><button class="btn light" data-restart>Refaire</button></div></div></article></section>`}function sheet(){if(!st.r)return `<section class="view sheetpage"><div class="sheet"><div class="sheetcopy"><h1>Ma fiche</h1><button class="btn dark" data-go="quiz">Commencer</button></div></div></section>`;let p=P[st.r.p];return `<section class="view sheetpage"><article class="sheet"><div class="sheethero"><img src="${p.im}"><div class="sheetcopy"><b>FFT PLAYER PROFILE</b><h1>${p.n}</h1><p>Esprit ${p.s}</p><p>« ${p.m} »</p></div></div><div class="sheetbody"><div class="box"><h3>Portrait</h3><p>${p.d}</p><h3>Forces</h3><ul>${p.fo.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="box"><h3>Points d’attention</h3><ul>${p.pa.map(x=>`<li>${x}</li>`).join('')}</ul><h3>Prompt signature</h3><p>${p.pr}</p></div></div></article></section>`}function room(){let rows=st.room.length?st.room:['P','P','P','P','P','C','C','C','B','B','E','E','J','J','J','S'],c=Object.fromEntries(K.map(k=>[k,rows.filter(x=>(x.p||x)===k).length])),mx=Math.max(...Object.values(c)),top=K.sort((a,b)=>c[b]-c[a])[0];return `<section class="view roompage"><div class="room"><h1 class="roomtitle">La salle</h1><div class="kpis"><div class="kpi"><b>${rows.length}</b>réponses</div><div class="kpi"><b>${P[top].n}</b>profil majoritaire</div><div class="kpi"><b>${Math.round(c[top]/rows.length*100)}%</b>de la salle</div></div><div class="roomgrid"><div class="panel"><h3>Tableau du match</h3>${K.map(k=>`<div class="bar"><span>${P[k].n}</span><span class="track"><i style="width:${c[k]/mx*100}%;background:${F[P[k].f]}"></i></span><b>${c[k]}</b></div>`).join('')}</div><div class="panel"><h3>Retour au court</h3><p>Le profil le plus présent est <b>${P[top].n}</b>. Cette vue est conçue pour un commentaire rapide avant de recentrer l’attention sur la conférence.</p>${st.r?'<button class="btn dark" data-add>Ajouter mon résultat local</button>':''}</div></div></div></section>`}function render(){app.innerHTML=st.v==='quiz'?quiz():st.v==='result'&&st.r?result():st.v==='sheet'?sheet():st.v==='room'?room():profiles();document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v===st.v?'page':'false'))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));document.getElementById('mb').onclick=()=>nav.classList.toggle('open');app.onclick=e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.go)return go(t.dataset.go);if(t.dataset.a!=null){st.a[st.i]=+t.dataset.a;document.getElementById('ex').classList.remove('play');void document.getElementById('ex').offsetWidth;document.getElementById('ex').classList.add('play');render();setTimeout(()=>document.getElementById('ex')?.classList.add('play'),20);return}if(t.hasAttribute('data-prev')){st.i=Math.max(0,st.i-1);render();return}if(t.hasAttribute('data-next')){if(st.a[st.i]==null)return;let ex=document.getElementById('ex');ex.classList.add('play');setTimeout(()=>{if(st.i<9){st.i++;render()}else{st.r=calc();localStorage.setItem('res',JSON.stringify(st.r));go('result')}},650);return}if(t.hasAttribute('data-restart')){st.i=0;st.a.fill(null);go('quiz')}if(t.hasAttribute('data-add')){st.room.push(st.r);localStorage.setItem('room',JSON.stringify(st.room));render()}};render();</script></body></html>
