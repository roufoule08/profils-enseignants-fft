*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);line-height:1.45;overflow-x:hidden}button{font:inherit}button:focus-visible{outline:4px solid var(--ball);outline-offset:3px}.top{height:72px;position:sticky;top:0;z-index:30;padding:0 clamp(16px,4vw,58px);display:flex;align-items:center;justify-content:space-between;background:rgba(5,59,44,.97);color:#fff;border-bottom:1px solid rgba(255,255,255,.16)}.brand{display:flex;align-items:center;gap:12px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.brand img{width:44px;height:54px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}.nav{display:flex;gap:7px}.nav button{border:0;background:transparent;color:#fff;padding:10px 11px;font-weight:800}.nav button[aria-current="page"]{border-bottom:3px solid var(--clay)}.menu{display:none;border:0;background:#fff;color:var(--green);padding:9px 13px;font-weight:900}.view{min-height:calc(100svh - 72px)}.profiles{padding:clamp(42px,7vw,90px) clamp(16px,5vw,72px);background:var(--cream)}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:5vw;align-items:center;margin-bottom:45px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--clay)}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:var(--display);text-transform:uppercase}h1{font-size:clamp(56px,8vw,112px);line-height:.82;letter-spacing:-.045em;color:var(--green);margin:15px 0 22px}h1 span{color:var(--clay)}.lead{max-width:720px;font-size:18px;color:#445149}.hero-art{min-height:430px;position:relative;background:linear-gradient(145deg,rgba(5,59,44,.12),rgba(211,82,32,.15));overflow:hidden}.hero-art:before{content:"";position:absolute;inset:9%;border:4px solid #fff;background:var(--clay);box-shadow:var(--shadow)}.hero-art:after{content:"";position:absolute;left:9%;right:9%;top:50%;border-top:4px solid #fff}.hero-ball{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-9deg);width:135px;height:135px}.tennis-ball{border-radius:50%;background:var(--ball);display:grid;place-items:center;color:var(--green);font-weight:950;position:relative;overflow:hidden;box-shadow:inset -8px -8px 0 rgba(116,126,20,.11)}.tennis-ball:before,.tennis-ball:after{content:"";position:absolute;width:78%;height:78%;border:3px solid #fff;border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}.tennis-ball:before{left:-56%}.tennis-ball:after{right:-56%}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:25px}.btn{border:0;padding:14px 22px;font-weight:900;cursor:pointer}.primary{background:var(--clay);color:#fff}.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:24px}.section-head h2{font-size:clamp(36px,5vw,65px);color:var(--green);margin:6px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.profile{background:#fff;border:1px solid var(--line);min-height:390px;position:relative;padding:22px;overflow:hidden;transition:transform .22s,box-shadow .22s}.profile:hover{transform:translateY(-5px);box-shadow:var(--shadow)}.profile:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}.profile-code{width:44px;height:44px}.profile h3{font-size:30px;color:var(--green);margin:18px 0 5px}.mirror{color:var(--clay);font-weight:900}.profile small{display:block;margin-top:18px;color:var(--muted)}
.quiz-view{padding:clamp(32px,6vw,75px) clamp(12px,5vw,68px);background:linear-gradient(rgba(5,59,44,.87),rgba(5,59,44,.95)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Court%20Philippe-Chatrier%2012.jpg');background-size:cover;background-position:center}.quiz{max-width:900px;margin:auto;background:rgba(255,255,255,.98);padding:clamp(20px,5vw,53px);box-shadow:var(--shadow)}.meta{display:flex;justify-content:space-between;gap:18px;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.11em;color:var(--muted)}.progress{height:6px;margin:14px 0 29px;background:#e3e7e2}.progress i{display:block;height:100%;background:var(--clay);transition:width .25s}.question{font-family:var(--display);font-size:clamp(31px,5vw,54px);font-weight:900;line-height:1.02;color:var(--green);margin:11px 0 25px}.answers{display:grid;gap:10px}.answer{width:100%;border:1.5px solid var(--line);background:#fff;padding:13px 15px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;transition:border-color .15s,background-color .15s}.answer:hover{border-color:#a6aea9}.answer.selected{border-color:var(--clay);background:#fff8f4}.answer-ball{width:42px;height:42px;flex:none;font-size:13px}.quiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:24px}.btn:disabled{opacity:.35;cursor:not-allowed}.no-flash,.no-flash *{animation:none!important}
.result-view{padding:clamp(35px,6vw,78px) clamp(12px,5vw,68px);background:linear-gradient(rgba(5,59,44,.9),rgba(5,59,44,.97)),url('https://commons.wikimedia.org/wiki/Special:FilePath/Court%20Philippe-Chatrier%2012.jpg');background-size:cover;background-position:center}.result{max-width:1100px;margin:auto;background:#fff;box-shadow:var(--shadow)}.result-hero{display:grid;grid-template-columns:330px 1fr;background:var(--green);color:#fff}.result-hero img{width:100%;height:430px;object-fit:cover;object-position:top}.result-copy{padding:35px}.result-copy h1{color:#fff;font-size:clamp(48px,6vw,82px);margin:8px 0}.personal-code{display:inline-block;background:var(--clay);padding:7px 11px;font-weight:900;letter-spacing:.08em}.result-body{padding:28px}.summary-grid,.dimensions,.details{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.card{background:var(--cream);padding:16px}.card b{display:block;color:var(--green);margin-bottom:5px}.score{font-size:27px;font-weight:900;color:var(--clay)}.dimension-track{height:11px;background:#dfe3df;margin-top:9px;position:relative}.dimension-track i{display:block;height:100%;background:var(--clay)}.ia-scale{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:9px}.ia-scale i{height:10px;background:#dfe3df}.ia-scale i.on{background:var(--blue)}.wide{grid-column:1/-1}.source-note{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}.room{max-width:1100px;margin:auto;background:#fff;padding:30px;box-shadow:var(--shadow)}.footer{background:var(--green);color:rgba(255,255,255,.68);padding:18px;text-align:center;font-size:11px}
@media(max-width:900px){.hero,.result-hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.hero-art{min-height:340px}.summary-grid,.dimensions,.details{grid-template-columns:1fr 1fr}.result-hero img{height:520px}}
@media(max-width:650px){.top{height:auto;min-height:66px;padding:10px 12px}.brand img{width:38px;height:46px}.menu{display:block}.nav{display:none;position:absolute;right:10px;top:60px;background:var(--green);padding:8px;flex-direction:column}.nav.open{display:flex}.profiles{padding:30px 12px}.grid{grid-template-columns:1fr}.hero-art{min-height:280px}.hero-ball{width:100px;height:100px}.section-head{align-items:start;flex-direction:column}.quiz-view,.result-view{padding:25px 10px}.quiz{padding:20px 13px}.meta{font-size:9px}.quiz-nav{flex-direction:column-reverse}.quiz-nav .btn{width:100%}.result-hero img{height:410px}.result-copy,.result-body{padding:20px 15px}.summary-grid,.dimensions,.details{grid-template-columns:1fr}.wide{grid-column:auto}}

<body><header class="top"><div class="brand"><img alt="Logo FFT" src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20F%C3%A9d%C3%A9ration%20fran%C3%A7aise%20de%20tennis.svg"><span>Profils enseignants</span></div><button class="menu" id="menu">Menu</button><nav class="nav" id="nav"><button data-view="profiles">Les profils</button><button data-view="quiz">Questionnaire</button><button data-view="result">Ma fiche</button><button data-view="room">La salle</button></nav></header><main id="app"></main><footer class="footer">Questionnaire ludique d’animation. Les tendances affichées ne constituent pas une évaluation professionnelle ou psychométrique.</footer><script>
const P={P:{name:'Le Passeur',family:'Sur le court',star:'Yannick Noah',devise:'Ma fierté, c’est de les voir progresser.',portrait:'Cœur de l’école de tennis, du baby au tennis ado. Vous vivez pour le déclic d’un enfant qui réussit son premier service.',forces:['Pédagogie et patience','Sens du jeu et de l’animation','Lien de confiance avec les familles'],pains:['Préparer des séances variées pour des groupes hétérogènes','Répondre aux parents','Suivre la progression de dizaines d’enfants'],ia:['Séances différenciées par niveau','Jeux pédagogiques et variantes','Messages aux parents et bilans'],prompt:'Prépare une séance d’1 h pour 8 enfants de 7-8 ans, niveau orange, objectif : le service.',why:'Joie de jouer, énergie de groupe et transmission.',anchor:'87 % des enseignants encadrent l’école de tennis et 68 % le mini-tennis.',v:{t:-.8,x:.4,g:-.8},img:'https://commons.wikimedia.org/wiki/Special:FilePath/Yannick%20Noah%20%28Roland%20Garros%202023%29%2001.jpg'},C:{name:'Le Coach de compétition',family:'Sur le court',star:'Novak Djokovic',devise:'Sur le court, c’est le résultat qui parle.',portrait:'Vous entraînez les compétiteurs, jeunes et adultes. Votre légitimité vient de votre niveau de jeu et de votre œil technique.',forces:['Expertise technique et tactique','Exigence et sens de la performance','Crédibilité de joueur'],pains:['Individualiser l’entraînement','Analyser les matchs','Planifier la saison et la charge'],ia:['Plans individualisés','Analyse de notes et statistiques','Routines mentales'],prompt:'Identifie 3 axes de travail à partir de mes notes de match et propose un cycle de 4 semaines.',why:'Préparation millimétrée, souci du détail et performance.',anchor:'55 % encadrent un centre d’entraînement jeunes.',v:{t:-.6,x:-.4,g:.8},img:'https://commons.wikimedia.org/wiki/Special:FilePath/Novak%20Djokovic%20French%20Open%202015.jpg'},B:{name:'Le Bâtisseur',family:'Autour du court',star:'Amélie Mauresmo',devise:'Je fais tourner le club.',portrait:'Responsable pédagogique ou directeur sportif, vous portez le projet de club, les relations avec la mairie et les programmes fédéraux.',forces:['Vision d’ensemble','Organisation et coordination d’équipe','Relais entre bénévoles, fédération et collectivité'],pains:['Temps administratif pris sur le court','Dossiers et reporting','Attentes multiples des dirigeants'],ia:['Dossiers de subvention','Comptes rendus','Plannings et tableaux de bord'],prompt:'Rédige la partie projet sportif du dossier de subvention municipale.',why:'Expérience de joueuse, capitaine, entraîneure et dirigeante.',anchor:'Rôles de gestionnaire de projets identifiés dans 12 clubs.',v:{t:.9,x:-.2,g:-.6},img:'https://commons.wikimedia.org/wiki/Special:FilePath/Amelie%20Mauresmo%20%2814235857599%29.jpg'},E:{name:'L’Entrepreneur',family:'Autour du court',star:'Serena Williams',devise:'Mon planning, c’est mon chiffre d’affaires.',portrait:'Salarié et libéral à la fois, souvent sur plusieurs clubs. Vous gérez votre clientèle de cours particuliers et de stages.',forces:['Sens du service','Autonomie','Création de nouvelles offres'],pains:['Remplir les créneaux','Facturation et relances','Cadre juridique'],ia:['Offres de stages','Textes pour les réseaux','Relances clients'],prompt:'Crée 3 offres de stage pour adultes débutants avec leurs textes de présentation.',why:'Performance sportive prolongée par une trajectoire entrepreneuriale.',anchor:'Environ 45 % ont une part d’activité libérale.',v:{t:.7,x:.7,g:.7},img:'https://commons.wikimedia.org/wiki/Special:FilePath/Serena%20Williams%20at%202013%20US%20Open.jpg'},J:{name:'Le Jeune Pro',family:'Trajectoires',star:'Moïse Kouamé',devise:'J’apprends tous les jours.',portrait:'En début de carrière, en formation ou tout juste diplômé. Curieux, connecté, vous construisez votre style.',forces:['Énergie et curiosité','Aisance numérique','Envie de se former'],pains:['Constituer son répertoire','Gérer les situations difficiles','Horaires morcelés'],ia:['Tuteur de révision','Banque d’exercices','Simulation de situations'],prompt:'Joue un parent mécontent afin que je m’entraîne à lui répondre.',why:'Une trajectoire de progression et d’apprentissage permanent.',anchor:'30 % ont 18-30 ans, dont 69 % avec un projet diplômant.',v:{t:-.3,x:.9,g:-.2},img:'https://upload.wikimedia.org/wikipedia/commons/5/5f/Carlos_Alcaraz_2025_FO.jpg'},S:{name:'Le Sage',family:'Trajectoires',star:'Roger Federer',devise:'J’ai tout vu passer. Montrez-moi que ça marche.',portrait:'Plus de 20 ans de métier, pilier du club et mémoire des adhérents. Pragmatique, vous choisissez vos nouveautés.',forces:['Expérience et recul','Fidélité des adhérents','Transmission aux jeunes collègues'],pains:['Outils chronophages','Paperasse','Devoir tout réapprendre'],ia:['Mettre le savoir au propre','Dicter au lieu d’écrire','Transmettre à l’équipe'],prompt:'Mets au propre ma progression pour enseigner le revers à une main.',why:'Élégance, calme et longévité.',anchor:'24 % ont 51 ans et plus.',v:{t:-.4,x:-.9,g:.1},img:'https://commons.wikimedia.org/wiki/Special:FilePath/Roger%20Federer%202012%20Indian%20Wells.jpg'}};
const Q=[['Votre métier','Votre meilleur moment de la semaine ?',[['Le mercredi avec l’école de tennis',{P:1}],['Un match gagné par un joueur que j’entraîne',{C:1}],['Un projet de club qui aboutit',{B:1}],['Un stage complet, réservé en quelques jours',{E:1}],['Une nouvelle séance testée qui fonctionne',{J:1}],['Un ancien élève qui revient me voir',{S:1}]]],['Votre métier','Ce qui vous prend le plus de temps hors du court ?',[['Préparer les séances et répondre aux parents',{P:1}],['Analyser les matchs et planifier',{C:1}],['Dossiers, réunions, plannings',{B:1}],['Communication, réservations, facturation',{E:1}],['Réviser et me former',{J:1}],['La paperasse que je repousse',{S:1}]]],['Votre métier','Votre légitimité vient d’abord de…',[['Ma pédagogie',{P:1}],['Mon niveau de jeu',{C:1}],['Ma capacité à organiser',{B:1}],['Ma clientèle fidèle',{E:1}],['Mon envie d’apprendre',{J:1}],['Mon expérience',{S:1}]]],['Votre métier','Votre public préféré ?',[['Les 5-12 ans',{P:1}],['Les compétiteurs',{C:1}],['Le club dans son ensemble',{B:1}],['Les adultes, en cours particulier',{E:1}],['Tous : je découvre encore',{J:1}],['Les fidèles de toujours',{S:1}]]],['Votre métier','On vous offre 2 heures de libre par semaine. Vous…',[['Inventez de nouveaux jeux',{P:1}],['Regardez des matchs à analyser',{C:1}],['Avancez le projet du club',{B:1}],['Lancez une nouvelle offre',{E:1}],['Suivez une formation',{J:1}],['Transmettez à un jeune collègue',{S:1}]]],['Votre parcours','Où en êtes-vous dans le métier ?',[['En formation, ou moins de 3 ans',{J:2}],['3 à 10 ans : je construis mon style',{P:1,C:1}],['10 à 20 ans : j’ai pris des responsabilités',{B:1,E:1}],['Plus de 20 ans : plusieurs générations',{S:2}]]],['Votre métier','Face à un nouvel outil, vous…',[['L’essayez s’il aide les enfants',{P:1}],['Voulez d’abord des données fiables',{C:1}],['Regardez s’il fait gagner du temps à l’équipe',{B:1}],['Calculez ce qu’il rapporte',{E:1}],['Foncez',{J:1}],['Attendez qu’on vous montre que ça marche',{S:1}]]],['Votre métier','Votre devise ?',[['Chaque enfant progresse',{P:1}],['Le terrain ne ment pas',{C:1}],['Seul on va vite, ensemble on va loin',{B:1}],['Mon créneau, ma valeur',{E:1}],['Toujours en progrès',{J:1}],['L’expérience avant tout',{S:1}]]],['Vous et l’IA','Aujourd’hui, l’IA et vous ?',[['Jamais essayé',{},0],['Testé une ou deux fois',{},1],['De temps en temps',{},2],['Chaque semaine',{},3],['Tous les jours',{},4]]],['Vous et l’IA','Pour quoi l’avez-vous déjà utilisée ?',[['Rien encore',{},0],['Questions générales',{},1],['Messages ou posts',{E:.5},2],['Séances ou plans',{P:.5,C:.5},3],['Données, vidéos ou automatisation',{C:.5,B:.5},4]]]];
const K=Object.keys(P),IA=['Découverte','Curieux','Utilisateur','Pratiquant','Moteur'],letters='ABCDEF';let S={view:location.hash.slice(1)||'profiles',step:0,answers:Array(10).fill(null),result:JSON.parse(localStorage.getItem('fft-v8-result')||'null')};const app=document.getElementById('app'),nav=document.getElementById('nav');function calc(){let score=Object.fromEntries(K.map(k=>[k,0])),lv=[];Q.forEach((q,i)=>{let r=q[2][S.answers[i]];if(!r)return;Object.entries(r[1]).forEach(([k,v])=>score[k]+=v);if(r[2]!==undefined)lv.push(r[2])});let tie=Q[2][2][S.answers[2]],depart=tie?Object.keys(tie[1])[0]:null,order=K.slice().sort((a,b)=>score[b]-score[a]||((b===depart)-(a===depart))||K.indexOf(a)-K.indexOf(b)),tot=K.reduce((s,k)=>s+score[k],0)||1,d={};['t','x','g'].forEach(x=>{let m=K.reduce((s,k)=>s+score[k]*P[k].v[x],0)/tot;d[x]=Math.round((1-m)/2*100)});return {profile:order[0],secondary:order[1],scores:score,...d,code:[d.t>=50?'T':'K',d.x>=50?'R':'X',d.g>=50?'G':'I'].join('-'),ia:Math.floor(lv.reduce((a,b)=>a+b,0)/lv.length+.5)}}function go(v){S.view=v;location.hash=v;nav.classList.remove('open');render();scrollTo(0,0)}function profiles(){return `<section class="view profiles"><div class="hero"><div><div class="eyebrow">Colloque des enseignants · FFT</div><h1>Quel profil <span>tennis</span> êtes-vous ?</h1><p class="lead">Une expérience moderne, identifiable Roland-Garros, fondée sur les 10 questions et le référentiel métier des enseignants.</p><div class="actions"><button class="btn primary" data-go="quiz">Entrer sur le court</button></div></div><div class="hero-art"><div class="hero-ball tennis-ball">10<br>points</div></div></div><div class="section-head"><div><div class="eyebrow">Les six profils</div><h2>Votre manière de jouer le métier</h2></div></div><div class="grid">${K.map(k=>`<article class="profile" style="--accent:${{P:'#d35220',C:'#d35220',B:'#283a84',E:'#283a84',J:'#16805a',S:'#16805a'}[k]}"><div class="profile-code tennis-ball">${k}</div><h3>${P[k].name}</h3><div class="mirror">Esprit ${P[k].star}</div><p>« ${P[k].devise} »</p><p>${P[k].portrait}</p><small>${P[k].anchor}</small></article>`).join('')}</div></section>`}function quiz(){let q=Q[S.step],sel=S.answers[S.step];return `<section class="view quiz-view"><div class="quiz no-flash"><div class="meta"><span>Point ${S.step+1} sur 10</span><span>${q[0]}</span></div><div class="progress"><i style="width:${(S.step+(sel!=null?1:0))*10}%"></i></div><div class="question">${q[1]}</div><div class="answers">${q[2].map((r,i)=>`<button class="answer ${sel===i?'selected':''}" data-answer="${i}" aria-pressed="${sel===i}"><span class="answer-ball tennis-ball">${letters[i]}</span><span>${r[0]}</span></button>`).join('')}</div><div class="quiz-nav"><button class="btn secondary" data-prev ${S.step===0?'disabled':''}>Rejouer le point précédent</button><button class="btn primary" data-next ${sel==null?'disabled':''}>${S.step===9?'Découvrir mon profil':'Servir le point suivant'}</button></div></div></section>`}function scale(level){return `<div class="ia-scale">${[0,1,2,3,4].map(i=>`<i class="${i<=level?'on':''}"></i>`).join('')}</div>`}function result(){if(!S.result)return `<section class="view result-view"><div class="room"><h2>Ma fiche</h2><p>Terminez le questionnaire pour afficher votre profil complet.</p><button class="btn primary" data-go="quiz">Entrer sur le court</button></div></section>`;let r=S.result,p=P[r.profile],s=P[r.secondary],dom=(v,a,b)=>v>=50?`${a} ${v}%`:`${b} ${100-v}%`;return `<section class="view result-view"><article class="result"><header class="result-hero"><img src="${p.img}" alt="Portrait illustratif"><div class="result-copy"><div class="eyebrow" style="color:var(--ball)">Votre profil principal</div><h1>${p.name}</h1><div class="personal-code">${r.code} · IA ${IA[r.ia]}</div><p><b>Personnalité miroir :</b> ${p.star}</p><p>« ${p.devise} »</p><p>${p.portrait}</p></div></header><div class="result-body"><div class="summary-grid"><div class="card"><b>Profil secondaire</b>${s.name}<br>${s.star}</div><div class="card"><b>Maturité IA</b>${IA[r.ia]}${scale(r.ia)}</div><div class="card"><b>Code personnel</b><span class="score">${r.code}</span></div></div><div class="dimensions"><div class="card"><b>Terrain ↔ Club</b>${dom(r.t,'Terrain','Club')}<div class="dimension-track"><i style="width:${r.t}%"></i></div></div><div class="card"><b>Repères ↔ Exploration</b>${dom(r.x,'Repères','Exploration')}<div class="dimension-track"><i style="width:${r.x}%"></i></div></div><div class="card"><b>Groupe ↔ Individuel</b>${dom(r.g,'Groupe','Individuel')}<div class="dimension-track"><i style="width:${r.g}%"></i></div></div></div><div class="details"><div class="card"><b>Vos forces</b><ul>${p.forces.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><b>Ce qui vous pèse</b><ul>${p.pains.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><b>Ce que l’IA peut faire pour vous</b><ul>${p.ia.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card wide"><b>Pourquoi ${p.star}</b><p>${p.why}</p><b>Votre prompt signature</b><p>${p.prompt}</p><b>Ancrage dans les données</b><p>${p.anchor}</p><b>Scores détaillés</b><p>${K.map(k=>`${P[k].name} : ${r.scores[k]}`).join(' · ')}</p><p class="source-note">Les dimensions sont des tendances calculées à partir des réponses. Cet outil est ludique et ne constitue pas un test psychométrique validé.</p></div></div><button class="btn primary" data-restart>Refaire le questionnaire</button></div></article></section>`}function room(){return `<section class="view result-view"><div class="room"><div class="eyebrow">Vue animateur</div><h2>La salle</h2><p>La restitution collective sera reconnectée au mode de collecte retenu avec la DSI. Le calcul individuel complet et les contenus métier sont maintenant intégrés.</p></div></section>`}function render(){app.innerHTML=S.view==='quiz'?quiz():S.view==='result'?result():S.view==='room'?room():profiles();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===S.view?'page':'false'))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.getElementById('menu').onclick=()=>nav.classList.toggle('open');app.onclick=e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.go)return go(t.dataset.go);if(t.dataset.answer!=null){S.answers[S.step]=+t.dataset.answer;render();return}if(t.hasAttribute('data-prev')){S.step=Math.max(0,S.step-1);render();return}if(t.hasAttribute('data-next')){if(S.answers[S.step]==null)return;if(S.step<9){S.step++;render()}else{S.result=calc();localStorage.setItem('fft-v8-result',JSON.stringify(S.result));go('result')}return}if(t.hasAttribute('data-restart')){S.step=0;S.answers.fill(null);go('quiz')}};render();</script></body></html>
