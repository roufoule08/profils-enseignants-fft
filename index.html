 "texte": "Face à un nouvel outil, vous…", "compte_pour_maturite_ia": false, "reponses": [{"texte": "Testez pour les élèves", "points": {"P": 1}}, {"texte": "Demandez des preuves", "points": {"C": 1}}, {"texte": "Regardez le collectif", "points": {"B": 1}}, {"texte": "Mesurez la valeur", "points": {"E": 1}}, {"texte": "Foncez", "points": {"J": 1}}, {"texte": "Attendez une démonstration", "points": {"S": 1}}]}, {"id": "Q8", "rubrique": "Votre métier", "texte": "Votre devise ?", "compte_pour_maturite_ia": false, "reponses": [{"texte": "Chaque enfant progresse", "points": {"P": 1}}, {"texte": "Le terrain ne ment pas", "points": {"C": 1}}, {"texte": "Ensemble on va loin", "points": {"B": 1}}, {"texte": "Mon créneau, ma valeur", "points": {"E": 1}}, {"texte": "Toujours en progrès", "points": {"J": 1}}, {"texte": "L’expérience avant tout", "points": {"S": 1}}]}, {"id": "Q9", "rubrique": "Vous et l’IA", "texte": "Aujourd’hui, l’IA et vous ?", "compte_pour_maturite_ia": true, "reponses": [{"texte": "Jamais essayé", "points": {}, "niveau_ia": 0}, {"texte": "Testé une fois", "points": {}, "niveau_ia": 1}, {"texte": "De temps en temps", "points": {}, "niveau_ia": 2}, {"texte": "Chaque semaine", "points": {}, "niveau_ia": 3}, {"texte": "Tous les jours", "points": {}, "niveau_ia": 4}]}, {"id": "Q10", "rubrique": "Vous et l’IA", "texte": "Pour quoi l’avez-vous déjà utilisée ?", "compte_pour_maturite_ia": true, "reponses": [{"texte": "Rien encore", "points": {}, "niveau_ia": 0}, {"texte": "Questions générales", "points": {}, "niveau_ia": 1}, {"texte": "Messages ou posts", "points": {"E": 0.5}, "niveau_ia": 2}, {"texte": "Séances ou plans", "points": {"P": 0.5, "C": 0.5}, "niveau_ia": 3}, {"texte": "Données ou automatisation", "points": {"C": 0.5, "B": 0.5}, "niveau_ia": 4}]}]},IMG={"P": "assets/yannick-noah.JPG", "C": "assets/novak-djokovic.jpg", "B": "assets/amelie-mauresmo.JPG", "E": "assets/serena-williams.JPG", "J": "assets/carlos-alcaraz.JPG", "S": "assets/roger-federer.jpg"},C=R.profils.map(p=>p.code),L='ABCDEF';let S={v:location.hash.slice(1)||'home',i:0,a:Array(10).fill(null),r:JSON.parse(localStorage.getItem('rg-result')||'null'),room:JSON.parse(localStorage.getItem('rg-room')||'[]')};const app=document.getElementById('app'),nav=document.getElementById('nav'),P=c=>R.profils.find(x=>x.code===c);function calc(){let sc=Object.fromEntries(C.map(c=>[c,0])),lv=[];R.questions.forEach((q,i)=>{let r=q.reponses[S.a[i]];if(!r)return;Object.entries(r.points).forEach(([c,v])=>sc[c]+=v);if(q.compte_pour_maturite_ia)lv.push(r.niveau_ia)});let qr=R.questions[2].reponses[S.a[2]],dep=qr?Object.keys(qr.points)[0]:null,o=C.slice().sort((a,b)=>sc[b]-sc[a]||((b===dep)-(a===dep))||C.indexOf(a)-C.indexOf(b)),tot=C.reduce((s,c)=>s+sc[c],0)||1,d={};R.dimensions.forEach(x=>{let m=C.reduce((s,c)=>s+sc[c]*P(c).vecteur[x.cle],0)/tot;d[x.cle]=Math.round((1-m)/2*100)});return{profil:o[0],secondaire:o[1],scores:sc,...d,code:R.dimensions.map(x=>d[x.cle]>=50?x.lettre_pole_1:x.lettre_pole_2).join('-'),ia:Math.round(lv.reduce((a,b)=>a+b,0)/lv.length),at:Date.now()}}function go(v){S.v=v;location.hash=v;nav.classList.remove('open');render();scrollTo(0,0)}function home(){return`<section class="view"><div class="hero"><div class="copy"><div class="ey">Colloque des enseignants · FFT</div><h1>Quel profil <span>tennis</span> êtes-vous ?</h1><p class="lead">Une expérience immersive inspirée des codes Roland-Garros, enrichie par le référentiel métier des enseignants.</p><div><button class="btn" data-go="quiz">Entrer sur le court</button></div></div><div class="heroimg"></div></div><div class="profiles"><div class="ey">Les six profils</div><h2>Votre manière de jouer le métier</h2><div class="grid">${C.map(c=>{let p=P(c);return`<article class="profile"><img src="${IMG[c]}"><div class="badge ball">${c}</div><div class="pt"><h3>${p.nom}</h3><b>Esprit ${p.joueur_miroir}</b><p>${p.devise}<br>${p.portrait}</p></div></article>`}).join('')}</div></div></section>`}function quiz(){let q=R.questions[S.i],sel=S.a[S.i];return`<section class="view quizpage"><div class="quiz"><div class="meta"><span>Point ${S.i+1}/10</span><span>${q.rubrique}</span></div><div class="progress"><i style="width:${(S.i+(sel!=null?1:0))*10}%"></i></div><div class="question">${q.texte}</div><div class="answers">${q.reponses.map((r,i)=>`<button class="answer ${sel===i?'selected':''}" data-a="${i}"><span class="ball">${L[i]}</span>${r.texte}</button>`).join('')}</div><div class="qnav"><button class="btn back" data-prev ${S.i===0?'disabled':''}>Rejouer le point précédent</button><button class="btn" data-next ${sel==null?'disabled':''}>${S.i===9?'Découvrir ma fiche':'Servir le point suivant'}</button></div></div></section>`}function result(){if(!S.r)return`<section class="view resultpage"><div class="room"><h1>Ma fiche</h1><button class="btn" data-go="quiz">Commencer</button></div></section>`;let r=S.r,p=P(r.profil),p2=P(r.secondaire),level=R.niveaux_ia.find(x=>x.niveau===r.ia),dom=(k,a,b)=>r[k]>=50?`${a} ${r[k]}%`:`${b} ${100-r[k]}%`;return`<section class="view resultpage"><article class="result"><div class="resulthead"><img src="${IMG[r.profil]}"><div class="rhcopy"><div class="ey" style="color:var(--b)">Profil principal</div><h1>${p.nom}</h1><div class="pills"><span>${r.code}</span><span>IA ${level.nom}</span></div><p>${p.devise}</p><p>${p.portrait}</p></div></div><div class="body"><div class="cards"><div class="card"><b>Profil secondaire</b><span class="big">${p2.nom}</span><br>${p2.joueur_miroir}</div><div class="card"><b>Maturité IA</b><span class="big">${level.nom}</span><p>${level.message}</p></div><div class="card"><b>Personnalité miroir</b><span class="big">${p.joueur_miroir}</span></div></div><div class="dims">${R.dimensions.map(d=>`<div class="card"><b>${d.pole_1} ↔ ${d.pole_2}</b>${dom(d.cle,d.pole_1,d.pole_2)}<div class="track"><i style="width:${r[d.cle]}%"></i></div><p>${d.definition}</p></div>`).join('')}</div><div class="details"><div class="card"><b>Vos forces</b><ul>${p.forces.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><b>Ce qui vous pèse</b><ul>${p.ce_qui_pese.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><b>Apports de l’IA</b><ul>${p.apports_ia.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card wide"><b>Pourquoi ${p.joueur_miroir}</b><p>${p.justification_joueur}</p><b>Prompt signature</b><p>${p.prompt_signature}</p><b>Ancrage dans les données</b><p>${p.ancrage_donnees}</p><b>Scores</b><div class="scores">${C.map(c=>`<span>${P(c).nom}: ${r.scores[c]}</span>`).join('')}</div></div></div><button class="btn" data-restart>Refaire le questionnaire</button></div></article></section>`}function room(){let rows=S.room.length?S.room:[{profil:'P'},{profil:'P'},{profil:'C'},{profil:'B'},{profil:'E'},{profil:'J'},{profil:'S'}],ct=Object.fromEntries(C.map(c=>[c,rows.filter(x=>x.profil===c).length])),mx=Math.max(...Object.values(ct)),top=C.slice().sort((a,b)=>ct[b]-ct[a])[0];return`<section class="view roompage"><div class="room"><h1>La salle</h1><div class="kpis"><div class="card"><b>Participants</b><span class="big">${rows.length}</span></div><div class="card"><b>Profil majoritaire</b><span class="big">${P(top).nom}</span></div><div class="card"><b>Part</b><span class="big">${Math.round(ct[top]/rows.length*100)}%</span></div></div>${C.map(c=>`<div class="barrow"><span>${P(c).nom}</span><span class="track"><i style="width:${ct[c]/mx*100}%"></i></span><b>${ct[c]}</b></div>`).join('')}</div></section>`}function render(){app.innerHTML=S.v==='quiz'?quiz():S.v==='result'?result():S.v==='room'?room():home();document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.v?'page':'false'))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));document.getElementById('menu').onclick=()=>nav.classList.toggle('open');app.onclick=e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.go)return go(t.dataset.go);if(t.dataset.a!=null){S.a[S.i]=+t.dataset.a;render();return}if(t.hasAttribute('data-prev')){S.i=Math.max(0,S.i-1);render();return}if(t.hasAttribute('data-next')){if(S.a[S.i]==null)return;if(S.i<9){S.i++;render()}else{S.r=calc();localStorage.setItem('rg-result',JSON.stringify(S.r));S.room.push(S.r);localStorage.setItem('rg-room',JSON.stringify(S.room));go('result')}return}if(t.hasAttribute('data-restart')){S.i=0;S.a.fill(null);go('quiz')}};render();</script></body></html>
