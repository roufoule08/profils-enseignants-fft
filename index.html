<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#003b2d"><title>Quel profil d'enseignant êtes-vous ?</title><style>
@import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500;8..144,600;8..144,700&display=swap');
:root{--green:#003b2d;--green2:#07533e;--clay:#d35220;--cream:#f7f3ea;--paper:#fff;--ink:#18211c;--muted:#68736d;--ball:#dce943;--blue:#283985;--line:#d9ddd7;--shadow:0 30px 90px rgba(0,42,31,.21);--body:'Roboto Flex',Arial,sans-serif;--display:'Barlow Condensed','Arial Narrow',Arial,sans-serif}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--body);overflow-x:hidden}button{font:inherit}button:focus-visible{outline:4px solid var(--ball);outline-offset:3px}.top{height:76px;position:sticky;top:0;z-index:50;padding:0 clamp(14px,4vw,64px);display:flex;align-items:center;justify-content:space-between;background:var(--green);color:white;border-bottom:1px solid #ffffff26}.brand{display:flex;align-items:center;gap:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}.brand img{width:43px;height:55px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}.nav{display:flex;gap:4px}.nav button,.menu{border:0;background:transparent;color:white;padding:11px 13px;font-weight:750}.nav button[aria-current=page]{background:white;color:var(--green)}.menu{display:none;background:white;color:var(--green)}.view{min-height:calc(100svh - 76px)}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:var(--display);text-transform:uppercase}.kicker{font-size:11px;font-weight:800;letter-spacing:.17em;text-transform:uppercase;color:var(--clay)}.btn{border:0;padding:14px 22px;font-weight:800;cursor:pointer;transition:transform .18s}.btn:hover{transform:translateY(-2px)}.primary{background:var(--clay);color:white}.ghost{background:white;color:var(--green);border:1px solid var(--line)}.btn:disabled{opacity:.32;cursor:not-allowed;transform:none}
/* LANDING */.landing{background:var(--cream)}.hero{min-height:calc(100svh - 76px);display:grid;grid-template-columns:1.03fr .97fr}.hero-copy{padding:clamp(44px,8vw,120px) clamp(22px,6vw,90px);display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(62px,9vw,126px);letter-spacing:-.045em;line-height:.78;color:var(--green);margin:18px 0 26px}.hero h1 span{color:var(--clay)}.lead{max-width:680px;color:#46534c;font-size:18px}.hero-media{position:relative;min-height:640px;background:linear-gradient(180deg,#003b2d15,#003b2dc7),url('https://commons.wikimedia.org/wiki/Special:FilePath/Court%20Philippe-Chatrier%2012.jpg');background-size:cover;background-position:center;overflow:hidden}.hero-media:before{content:'';position:absolute;inset:8%;border:4px solid rgba(255,255,255,.7)}.hero-media:after{content:'';position:absolute;left:8%;right:8%;top:50%;border-top:4px solid rgba(255,255,255,.7)}.hero-ball{position:absolute;z-index:2;left:50%;top:50%;width:145px;height:145px;transform:translate(-50%,-50%) rotate(-8deg);font:900 26px/1 var(--display);text-transform:uppercase}.facts{display:flex;gap:22px;margin-top:28px;flex-wrap:wrap}.facts b{display:block;font:900 36px/1 var(--display);color:var(--green)}.facts span{font-size:12px;color:var(--muted);text-transform:uppercase}.profiles-section{padding:70px clamp(16px,5vw,76px)}.section-title{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:28px}.section-title h2{font-size:clamp(44px,6vw,78px);line-height:.9;color:var(--green);margin:8px 0}.profiles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.persona{min-height:470px;position:relative;overflow:hidden;color:white;background:var(--green);box-shadow:var(--shadow)}.persona img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top center}.persona:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 25%,rgba(0,30,22,.15) 48%,rgba(0,28,20,.96) 100%)}.persona-copy{position:absolute;z-index:2;left:0;right:0;bottom:0;padding:25px}.persona-code{position:absolute;z-index:3;right:18px;top:18px;width:44px;height:44px}.persona h3{font-size:36px;line-height:.9;margin:12px 0 5px}.persona .mirror{color:var(--ball);font-weight:800}.persona p{font-size:14px;color:#ffffffd1;margin-bottom:0}.family{display:inline-block;background:var(--accent);padding:5px 9px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.1em}
/* TENNIS BALL */.tennis-ball{border-radius:50%;background:var(--ball);display:grid;place-items:center;color:var(--green);font-weight:900;position:relative;overflow:hidden;box-shadow:inset -7px -7px 0 rgba(110,120,18,.12)}.tennis-ball:before,.tennis-ball:after{content:'';position:absolute;width:78%;height:78%;border:3px solid white;border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}.tennis-ball:before{left:-56%}.tennis-ball:after{right:-56%}
/* QUIZ */.quiz-page{padding:clamp(32px,6vw,80px) 14px;background:linear-gradient(#003b2de9,#003b2df6),url('https://commons.wikimedia.org/wiki/Special:FilePath/Court%20Philippe-Chatrier%2012.jpg');background-size:cover;background-position:center}.quiz-card{max-width:900px;margin:auto;background:white;box-shadow:var(--shadow);padding:clamp(20px,5vw,55px)}.quiz-meta{display:flex;justify-content:space-between;gap:15px;font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:800;color:var(--muted)}.progress{height:6px;background:#e5e8e4;margin:15px 0 30px}.progress i{display:block;height:100%;background:var(--clay);transition:width .25s}.q-tag{color:var(--clay);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.12em}.question{font:900 clamp(35px,5.2vw,60px)/.98 var(--display);text-transform:uppercase;color:var(--green);margin:13px 0 27px}.answers{display:grid;gap:10px}.answer{width:100%;border:1.5px solid var(--line);background:white;padding:13px 15px;display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;transition:border-color .12s,background-color .12s}.answer:hover{border-color:#97a19b}.answer.selected{border-color:var(--clay);background:#fff8f4}.answer-ball{width:43px;height:43px;flex:none;font-size:12px}.quiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:25px}
/* RESULT */.result-page,.room-page{padding:clamp(32px,6vw,80px) 14px;background:linear-gradient(#003b2de8,#003b2df5),url('https://commons.wikimedia.org/wiki/Special:FilePath/Court%20Philippe-Chatrier%2012.jpg');background-size:cover;background-position:center}.result-shell,.room-shell{max-width:1140px;margin:auto;background:white;box-shadow:var(--shadow)}.result-hero{display:grid;grid-template-columns:390px 1fr;background:var(--green);color:white}.result-photo{min-height:520px;position:relative}.result-photo img{position:absolute;width:100%;height:100%;object-fit:cover;object-position:top}.result-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(transparent 65%,rgba(0,40,29,.88))}.photo-label{position:absolute;z-index:2;left:20px;bottom:20px}.photo-label small{display:block;text-transform:uppercase;letter-spacing:.12em;color:var(--ball)}.photo-label b{font:900 31px var(--display)}.result-intro{padding:45px}.result-intro h1{font-size:clamp(55px,7vw,92px);line-height:.8;margin:12px 0;color:white}.identity{display:flex;gap:8px;flex-wrap:wrap}.pill{background:var(--clay);padding:7px 10px;font-weight:800}.pill.alt{background:white;color:var(--green)}.result-body{padding:30px}.overview,.axis-grid,.content-grid,.score-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.panel{background:var(--cream);padding:17px}.panel b{display:block;color:var(--green);margin-bottom:6px}.big{font:900 31px var(--display);color:var(--clay)}.ia{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:10px}.ia i{height:10px;background:#dce1dc}.ia i.on{background:var(--blue)}.axis{height:11px;background:#dce1dc;margin-top:10px}.axis i{display:block;height:100%;background:var(--clay)}.wide{grid-column:1/-1}.profile-scores{display:flex;gap:9px;flex-wrap:wrap}.profile-scores span{background:white;border:1px solid var(--line);padding:8px 10px}.fine{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}.room-shell{padding:32px}.room-shell h1{font-size:70px;color:var(--green);line-height:.85}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bar-row{display:grid;grid-template-columns:160px 1fr 45px;gap:10px;align-items:center;margin:12px 0}.bar-track{height:15px;background:#e2e6e2}.bar-track i{display:block;height:100%}.footer{padding:19px;background:var(--green);color:#ffffffa5;text-align:center;font-size:11px}
@media(max-width:930px){.hero,.result-hero{grid-template-columns:1fr}.hero-media{min-height:430px}.profiles-grid{grid-template-columns:1fr 1fr}.result-photo{min-height:550px}.overview,.axis-grid,.content-grid,.score-grid{grid-template-columns:1fr 1fr}}
@media(max-width:650px){.top{height:auto;min-height:66px;padding:10px 12px}.brand img{width:37px;height:45px}.menu{display:block}.nav{display:none;position:absolute;right:10px;top:59px;background:var(--green);padding:8px;flex-direction:column}.nav.open{display:flex}.hero-copy{padding:42px 16px}.hero h1{font-size:64px}.hero-media{min-height:310px}.hero-ball{width:106px;height:106px;font-size:20px}.profiles-section{padding:45px 12px}.section-title{align-items:start;flex-direction:column}.profiles-grid{grid-template-columns:1fr}.persona{min-height:450px}.quiz-page,.result-page,.room-page{padding:22px 9px}.quiz-card{padding:20px 13px}.quiz-meta{font-size:9px}.quiz-nav{flex-direction:column-reverse}.quiz-nav .btn{width:100%}.result-photo{min-height:430px}.result-intro,.result-body{padding:22px 14px}.overview,.axis-grid,.content-grid,.score-grid,.kpis{grid-template-columns:1fr}.wide{grid-column:auto}.room-shell{padding:22px 13px}.room-shell h1{font-size:52px}.bar-row{grid-template-columns:105px 1fr 30px;font-size:12px}}
</style></head><body><header class="top"><div class="brand"><img src="https://fr.wikipedia.org/wiki/Special:FilePath/Logo%20F%C3%A9d%C3%A9ration%20fran%C3%A7aise%20de%20tennis.svg" alt="Logo FFT"><span>Profils enseignants</span></div><button class="menu" id="menu">Menu</button><nav class="nav" id="nav"><button data-view="landing">Les profils</button><button data-view="quiz">Questionnaire</button><button data-view="result">Ma fiche</button><button data-view="room">La salle</button></nav></header><main id="app"></main><footer class="footer">Outil ludique d’animation, appuyé sur des études. Il ne constitue pas une évaluation professionnelle ou un test psychométrique validé.</footer><script>

 Q9 et Q10, arrondie à l'entier le plus proche (0,5 vers le haut).", "test": {"reponses": {"Q1": "A", "Q2": "A", "Q3": "A", "Q4": "E", "Q5": "A", "Q6": "B", "Q7": "E", "Q8": "A", "Q9": "C", "Q10": "D"}, "attendu": {"profil": "P", "secondaire": "J", "t": 84, "x": 31, "g": 72, "code": "T-X-G", "ia": 3}}}};const IMAGES={"P": "https://commons.wikimedia.org/wiki/Special:FilePath/Yannick%20Noah%20%28Roland%20Garros%202023%29%2001.jpg", "C": "https://commons.wikimedia.org/wiki/Special:FilePath/Novak%20Djokovic%20French%20Open%202015.jpg", "B": "https://commons.wikimedia.org/wiki/Special:FilePath/Amelie%20Mauresmo%20%2814235857599%29.jpg", "E": "https://commons.wikimedia.org/wiki/Special:FilePath/Serena%20Williams%20at%202013%20US%20Open.jpg", "J": "https://upload.wikimedia.org/wikipedia/commons/5/5f/Carlos_Alcaraz_2025_FO.jpg", "S": "https://commons.wikimedia.org/wiki/Special:FilePath/Roger%20Federer%202012%20Indian%20Wells.jpg"};const CODES=R.profils.map(p=>p.code),LETTERS='ABCDEF';const IA=R.niveaux_ia.map(x=>x.nom);let S={view:location.hash.slice(1)||'landing',step:0,answers:Array(R.questions.length).fill(null),result:JSON.parse(localStorage.getItem('rg-teachers-result')||'null'),room:JSON.parse(localStorage.getItem('rg-teachers-room')||'[]')};const app=document.getElementById('app'),nav=document.getElementById('nav');const person=c=>R.profils.find(p=>p.code===c),family=c=>R.familles.find(f=>f.code===c);function calc(){let scores=Object.fromEntries(CODES.map(c=>[c,0])),levels=[];R.questions.forEach((q,i)=>{let r=q.reponses[S.answers[i]];if(!r)return;Object.entries(r.points).forEach(([c,v])=>scores[c]+=v);if(q.compte_pour_maturite_ia)levels.push(r.niveau_ia)});let q3=R.questions.find(q=>q.id==='Q3').reponses[S.answers[2]],depart=q3?Object.keys(q3.points)[0]:null,order=CODES.slice().sort((a,b)=>scores[b]-scores[a]||((b===depart)-(a===depart))||CODES.indexOf(a)-CODES.indexOf(b)),total=CODES.reduce((s,c)=>s+scores[c],0)||1,d={};R.dimensions.forEach(x=>{let m=CODES.reduce((s,c)=>s+scores[c]*person(c).vecteur[x.cle],0)/total;d[x.cle]=Math.round((1-m)/2*100)});let code=R.dimensions.map(x=>d[x.cle]>=50?x.lettre_pole_1:x.lettre_pole_2).join('-'),ia=levels.length?Math.round(levels.reduce((a,b)=>a+b,0)/levels.length):0;return{profil:order[0],secondaire:order[1],scores,...d,code,ia,at:Date.now()}}function go(v){S.view=v;location.hash=v;nav.classList.remove('open');render();scrollTo({top:0,behavior:'smooth'})}function landing(){return `<section class="view landing"><div class="hero"><div class="hero-copy"><div class="kicker">Colloque des enseignants · FFT</div><h1>Quel profil <span>tennis</span> êtes-vous ?</h1><p class="lead">Une expérience éditoriale immersive inspirée des codes de Roland-Garros, construite à partir du référentiel métier des enseignants.</p><div><button class="btn primary" data-go="quiz">Entrer sur le court</button></div><div class="facts"><div><b>10</b><span>questions</span></div><div><b>6</b><span>profils</span></div><div><b>3</b><span>dimensions</span></div></div></div><div class="hero-media"><div class="hero-ball tennis-ball">Votre<br>profil</div></div></div><div class="profiles-section"><div class="section-title"><div><div class="kicker">Les profils enseignants</div><h2>Six manières de jouer le métier</h2></div></div><div class="profiles-grid">${CODES.map(c=>{let p=person(c),f=family(p.famille),accent={court:'#d35220',club:'#283985',traj:'#16805a'}[p.famille];return `<article class="persona" style="--accent:${accent}"><img src="${IMAGES[c]}" alt="Portrait illustratif"><div class="persona-code tennis-ball">${c}</div><div class="persona-copy"><span class="family">${f.nom}</span><h3>${p.nom}</h3><div class="mirror">Esprit ${p.joueur_miroir}</div><p>${p.devise}<br>${p.portrait}</p></div></article>`}).join('')}</div></div></section>`}function quiz(){let q=R.questions[S.step],sel=S.answers[S.step];return `<section class="view quiz-page"><div class="quiz-card"><div class="quiz-meta"><span>Point ${S.step+1} sur ${R.questions.length}</span><span>${q.rubrique}</span></div><div class="progress"><i style="width:${(S.step+(sel!=null?1:0))/R.questions.length*100}%"></i></div><div class="q-tag">Répondez spontanément</div><div class="question">${q.texte}</div><div class="answers">${q.reponses.map((r,i)=>`<button class="answer ${sel===i?'selected':''}" data-answer="${i}" aria-pressed="${sel===i}"><span class="answer-ball tennis-ball">${LETTERS[i]}</span><span>${r.texte}</span></button>`).join('')}</div><div class="quiz-nav"><button class="btn ghost" data-prev ${S.step===0?'disabled':''}>Rejouer le point précédent</button><button class="btn primary" data-next ${sel==null?'disabled':''}>${S.step===R.questions.length-1?'Découvrir ma fiche':'Servir le point suivant'}</button></div></div></section>`}function iaScale(n){return `<div class="ia">${[0,1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}</div>`}function result(){if(!S.result)return `<section class="view result-page"><div class="room-shell"><h1>Ma fiche</h1><p>Terminez le questionnaire pour afficher votre résultat complet.</p><button class="btn primary" data-go="quiz">Entrer sur le court</button></div></section>`;let r=S.result,p=person(r.profil),p2=person(r.secondaire),level=R.niveaux_ia.find(x=>x.niveau===r.ia),dim=(key,a,b)=>{let v=r[key],left=v>=50;return `${left?a:b} ${left?v:100-v}%`};return `<section class="view result-page"><article class="result-shell"><div class="result-hero"><div class="result-photo"><img src="${IMAGES[r.profil]}" alt="Portrait illustratif"><div class="photo-label"><small>Personnalité miroir</small><b>${p.joueur_miroir}</b></div></div><div class="result-intro"><div class="kicker" style="color:var(--ball)">Votre profil principal</div><h1>${p.nom}</h1><div class="identity"><span class="pill">${r.code}</span><span class="pill alt">IA ${level.nom}</span></div><p>${p.devise}</p><p>${p.portrait}</p></div></div><div class="result-body"><div class="overview"><div class="panel"><b>Profil secondaire</b><span class="big">${p2.nom}</span><br>${p2.joueur_miroir}</div><div class="panel"><b>Maturité IA</b>${level.nom}${iaScale(r.ia)}<p>${level.message}</p></div><div class="panel"><b>Code personnel</b><span class="big">${r.code}</span><p>Votre combinaison de tendances.</p></div></div><div class="axis-grid">${R.dimensions.map(d=>`<div class="panel"><b>${d.pole_1} ↔ ${d.pole_2}</b>${dim(d.cle,d.pole_1,d.pole_2)}<div class="axis"><i style="width:${r[d.cle]}%"></i></div><p>${d.definition}</p></div>`).join('')}</div><div class="content-grid"><div class="panel"><b>Vos forces</b><ul>${p.forces.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="panel"><b>Ce qui vous pèse</b><ul>${p.ce_qui_pese.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="panel"><b>Ce que l’IA peut faire pour vous</b><ul>${p.apports_ia.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="panel wide"><b>Pourquoi ${p.joueur_miroir}</b><p>${p.justification_joueur}</p><b>Votre prompt signature</b><p>${p.prompt_signature}</p><b>Ancrage dans les données</b><p>${p.ancrage_donnees}</p><b>Scores détaillés</b><div class="profile-scores">${CODES.map(c=>`<span>${person(c).nom} : <b>${r.scores[c]}</b></span>`).join('')}</div><p class="fine">Les dimensions représentent des tendances indicatives issues des réponses. Les joueurs et joueuses illustrent des traits publics, sans suggérer de partenariat ou d’approbation.</p></div></div><button class="btn primary" data-restart>Refaire le questionnaire</button></div></article></section>`}function room(){let rows=S.room.length?S.room:[{profil:'P'},{profil:'P'},{profil:'P'},{profil:'C'},{profil:'C'},{profil:'B'},{profil:'E'},{profil:'J'},{profil:'J'},{profil:'S'}],counts=Object.fromEntries(CODES.map(c=>[c,rows.filter(x=>x.profil===c).length])),max=Math.max(...Object.values(counts)),top=CODES.slice().sort((a,b)=>counts[b]-counts[a])[0];return `<section class="view room-page"><div class="room-shell"><div class="kicker">Vue animateur</div><h1>La salle</h1><div class="kpis"><div class="panel"><b>Participants</b><span class="big">${rows.length}</span></div><div class="panel"><b>Profil majoritaire</b><span class="big">${person(top).nom}</span></div><div class="panel"><b>Part majoritaire</b><span class="big">${Math.round(counts[top]/rows.length*100)}%</span></div></div><div class="panel" style="margin-top:15px"><b>Répartition des profils</b>${CODES.slice().sort((a,b)=>counts[b]-counts[a]).map(c=>`<div class="bar-row"><span>${person(c).nom}</span><span class="bar-track"><i style="width:${counts[c]/max*100}%;background:${{P:'#d35220',C:'#d35220',B:'#283985',E:'#283985',J:'#16805a',S:'#16805a'}[c]}"></i></span><b>${counts[c]}</b></div>`).join('')}<p class="fine">Données de démonstration si aucun résultat collectif n’est connecté. La collecte réelle devra être validée avec la DSI.</p></div></div></section>`}function render(){app.innerHTML=S.view==='quiz'?quiz():S.view==='result'?result():S.view==='room'?room():landing();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===S.view?'page':'false'))}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.getElementById('menu').onclick=()=>nav.classList.toggle('open');app.onclick=e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.go)return go(t.dataset.go);if(t.dataset.answer!=null){S.answers[S.step]=+t.dataset.answer;render();return}if(t.hasAttribute('data-prev')){S.step=Math.max(0,S.step-1);render();return}if(t.hasAttribute('data-next')){if(S.answers[S.step]==null)return;if(S.step<R.questions.length-1){S.step++;render()}else{S.result=calc();localStorage.setItem('rg-teachers-result',JSON.stringify(S.result));if(!S.room.some(x=>x.at===S.result.at)){S.room.push(S.result);localStorage.setItem('rg-teachers-room',JSON.stringify(S.room))}go('result')}return}if(t.hasAttribute('data-restart')){S.step=0;S.answers.fill(null);go('quiz')}};render();
