const S={view:location.hash.slice(1)||"profiles",step:0,ans:Array(Q.length).fill(null),result:store.get("fft-result",null),history:store.get("fft-history",[]),room:store.get("fft-room",[]),sheetKey:null};
const app=document.getElementById('app'),navEl=document.getElementById('nav');
function fallback(img,k){img.onerror=null;img.src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000"><rect width="100%" height="100%" fill="#073c2d"/><circle cx="400" cy="420" r="190" fill="#dbe83f"/><text x="400" y="470" text-anchor="middle" font-family="Arial" font-weight="900" font-size="180" fill="#073c2d">${k}</text></svg>`)}
function changeView(v){S.view=v;location.hash=v;navEl.classList.remove('open');render();scrollTo({top:0,behavior:'smooth'})}
function profiles(){return `<section class="view profiles-stage"><div class="section-head"><div><div class="kicker">Profils enseignants FFT</div><h2>Entrez dans le jeu</h2><p>Découvrez les six univers avant de répondre. Chaque profil associe une posture professionnelle à une personnalité du tennis.</p></div><button class="btn btn-dark" data-go="quiz">Commencer le questionnaire →</button></div><div class="profile-grid">${K.map(k=>{const p=P[k],f=F[p.fam];return `<article class="profile-card" style="--accent:${f.accent}"><img loading="lazy" src="${p.img}" alt="Portrait illustratif de ${p.star}" onerror="fallback(this,'${k}')"><div class="ball-mark">${k}</div><div class="profile-content"><span class="surface">${f.name}</span><h3>${p.name}</h3><div class="player-name">Esprit ${p.star}</div><p>« ${p.motto} »<br>${p.portrait}</p></div></article>`}).join('')}</div></section>`}
function quiz(){const q=Q[S.step],sel=S.ans[S.step],letters='ABCDEF';return `<section class="view quiz-page"><div class="quiz-shell question-enter"><div class="quiz-meta"><span>Question ${S.step+1} sur ${Q.length}</span><span>Répondez spontanément</span></div><div class="progress"><i style="width:${(S.step+(sel!=null?1:0))/Q.length*100}%"></i></div><span class="qtag">${q[0]}</span><div class="qtitle">${q[1]}</div><div class="answers">${q[2].map((a,i)=>`<button class="answer" data-answer="${i}" aria-pressed="${sel===i}"><span class="answer-ball">${letters[i]}</span><span>${a[0]}</span></button>`).join('')}</div><div class="quiz-nav"><button class="btn btn-outline" data-prev ${S.step===0?'disabled':''}>← Précédent</button><button class="btn btn-clay" data-next ${sel==null?'disabled':''}>${S.step===Q.length-1?'Révéler mon profil':'Question suivante →'}</button></div></div></section>`}
function compute(){const scores=Object.fromEntries(K.map(k=>[k,0]));Q.forEach((q,i)=>{const a=q[2][S.ans[i]];if(a)Object.entries(a[1]).forEach(([k,v])=>scores[k]+=v)});const order=K.slice().sort((a,b)=>scores[b]-scores[a]||K.indexOf(a)-K.indexOf(b));return {persona:order[0],second:order[1],scores,at:Date.now()}}
function result(){const k=S.result.persona,p=P[k],secondary=P[S.result.second];return `<section class="view result-page"><div class="reveal-title kicker" style="justify-content:center">Votre carte joueur</div><article class="player-card-result"><div class="result-photo"><img src="${p.img}" alt="Portrait illustratif de ${p.star}" onerror="fallback(this,'${k}')"><div class="result-badge"><small>Personnalité miroir</small><b>${p.star}</b></div></div><div class="result-info"><div class="rank-number">${k}</div><div class="result-kicker">Profil dominant</div><h2>${p.name}</h2><div class="result-motto">« ${p.motto} »</div><p>${p.portrait}</p><div class="stat-grid"><div class="stat"><b>Forces</b>${p.forces.join(' · ')}</div><div class="stat"><b>Points d'attention</b>${p.pains.join(' · ')}</div><div class="stat"><b>Profil secondaire</b>${secondary.name}</div><div class="stat"><b>Univers</b>${F[p.fam].name}</div></div><div class="prompt-box"><small>Votre prompt signature</small><p>${p.prompt}</p></div><div class="result-actions"><button class="btn btn-dark" data-go="sheet">Voir ma fiche détaillée</button><button class="btn btn-outline" data-go="room">Voir la salle</button><button class="btn btn-outline" data-restart>Refaire</button></div></div></article></section>`}
function sheet(){const k=S.sheetKey||S.result?.persona;if(!k)return `<section class="view simple-page"><div class="sheet"><div class="sheet-head"><h2>Ma fiche</h2><p>Aucune fiche enregistrée sur cet appareil.</p><button class="btn btn-primary" data-go="quiz">Commencer</button></div></div></section>`;const p=P[k];return `<section class="view simple-page"><article class="sheet"><div class="sheet-head"><div class="kicker">Fiche personnelle</div><h2>${p.name}</h2><p>Personnalité miroir : <b>${p.star}</b></p></div><div class="sheet-body"><div><div class="info-box"><h3>Portrait</h3><p>${p.portrait}</p></div><div class="info-box"><h3>Forces</h3><ul>${p.forces.map(x=>`<li>${x}</li>`).join('')}</ul></div></div><div><div class="info-box"><h3>Usages IA</h3><ul>${p.ia.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="info-box"><h3>Prompt signature</h3><p>${p.prompt}</p><button class="btn btn-outline" data-copy>Copier</button></div></div></div></article></section>`}
function room(){const rows=S.room.length?S.room:[...Array(5)].map(()=>({persona:'P'})).concat([...Array(3)].map(()=>({persona:'C'})),[{persona:'B'},{persona:'B'},{persona:'E'},{persona:'E'},{persona:'J'},{persona:'J'},{persona:'J'},{persona:'S'}]),counts=Object.fromEntries(K.map(k=>[k,rows.filter(x=>x.persona===k).length])),max=Math.max(...Object.values(counts),1),top=K.slice().sort((a,b)=>counts[b]-counts[a])[0];return `<section class="view simple-page"><div class="room-panel"><div class="section-head"><div><div class="kicker">Vue animateur</div><h2>La salle</h2></div><span class="qtag">${S.room.length?'Résultats locaux anonymes':'Démonstration'}</span></div><div class="kpis"><div class="kpi"><b>${rows.length}</b>réponses</div><div class="kpi"><b>${P[top].name}</b>profil majoritaire</div><div class="kpi"><b>${Math.round(counts[top]/rows.length*100)}%</b>de la salle</div></div><div class="room-grid"><div class="info-box"><h3>Répartition</h3>${K.slice().sort((a,b)=>counts[b]-counts[a]).map(k=>`<div class="bar"><span>${P[k].name}</span><span class="bar-track"><i style="width:${counts[k]/max*100}%;background:${F[P[k].fam].accent}"></i></span><b>${counts[k]}</b></div>`).join('')}</div><div class="info-box"><h3>Retour à la conférence</h3><p>Le profil le plus représenté est <b>${P[top].name}</b>. Cette lecture rapide permet de rebondir, puis de recentrer l'attention sur l'intervention.</p><p style="color:var(--muted);font-size:12px">Pour agréger réellement plusieurs téléphones, il faudra connecter le site à une base de données. Cette version GitHub Pages fonctionne en démonstration et en stockage local.</p>${S.result?'<button class="btn btn-dark" data-add>Ajouter mon résultat local</button>':''}</div></div></div></section>`}
function render(){app.innerHTML=S.view==='quiz'?quiz():S.view==='result'&&S.result?result():S.view==='sheet'?sheet():S.view==='room'?room():profiles();document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-current',b.dataset.view===S.view?'page':'false'))}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>changeView(b.dataset.view));document.getElementById('menuBtn').onclick=()=>navEl.classList.toggle('open');app.onclick=async e=>{const t=e.target.closest('button');if(!t)return;if(t.dataset.go){changeView(t.dataset.go);return}if(t.dataset.answer!=null){S.ans[S.step]=+t.dataset.answer;render();return}if(t.hasAttribute('data-prev')){S.step=Math.max(0,S.step-1);render();return}if(t.hasAttribute('data-next')){if(S.ans[S.step]==null)return;if(S.step<Q.length-1){S.step++;render()}else{S.result=compute();S.history=[S.result,...S.history].slice(0,6);store.set('fft-result',S.result);store.set('fft-history',S.history);changeView('result')}return}if(t.hasAttribute('data-restart')){S.step=0;S.ans.fill(null);changeView('quiz');return}if(t.hasAttribute('data-copy')){try{await navigator.clipboard.writeText(P[S.result.persona].prompt);t.textContent='Copié ✓'}catch{t.textContent='Sélectionnez le texte'}return}if(t.hasAttribute('data-add')){S.room.push({persona:S.result.persona,at:Date.now()});store.set('fft-room',S.room);render()}};window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(['profiles','quiz','result','sheet','room'].includes(v)){S.view=v;render()}});if(!['profiles','quiz','result','sheet','room'].includes(S.view))S.view='profiles';render();
</script>
</body></html>
