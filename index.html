<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#082f57"><title>Profils Enseignants FFT</title>
<style>
:root{--blue:#082f57;--blue2:#061f3b;--clay:#bd5a35;--clay2:#963f22;--cream:#f7f2e9;--paper:#fff;--ink:#17241e;--muted:#667169;--line:#dce1dd;--ball:#d6e33d;--green:#39704d;--green-soft:#e3efe7;--blue-soft:#e6eef7;--clay-soft:#f6e3da;--shadow:0 18px 48px rgba(14,35,28,.12);--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,Arial,sans-serif;line-height:1.45}button,input,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}:focus-visible{outline:4px solid var(--ball);outline-offset:3px}
.shell{width:min(1120px,calc(100% - 32px));margin:auto}.top{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:18px;border-bottom:1px solid rgba(23,36,30,.14);position:relative}.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--blue);color:#fff;font-weight:900}.brand b{display:block;color:var(--blue);text-transform:uppercase}.brand small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.menu{display:flex;align-items:center;gap:4px}.menu button{border:0;background:transparent;padding:10px 12px;border-radius:999px;color:var(--muted);font-weight:750}.menu button[aria-current="page"]{background:var(--blue);color:#fff}.mobile-menu{display:none;border:0;background:var(--blue);color:#fff;border-radius:999px;padding:10px 14px;font-weight:800}
main{min-height:calc(100vh - 138px)}.view{padding:42px 0 64px;animation:enter .28s ease both}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;font-weight:900;color:var(--clay2)}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:Arial Narrow,Arial,sans-serif}h1{font-size:clamp(48px,8vw,86px);line-height:.9;letter-spacing:-.035em;text-transform:uppercase;color:var(--blue);margin:12px 0 18px}h1 span{color:var(--clay)}h2{font-size:clamp(32px,5vw,52px);line-height:1;text-transform:uppercase;color:var(--blue);margin-bottom:12px}.lead{max-width:700px;font-size:18px;color:#3c4942}.btn{border:0;border-radius:999px;padding:13px 21px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:8px}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;color:var(--blue);border:1px solid rgba(8,47,87,.18)}.clay{background:var(--clay);color:#fff}.btn:disabled{opacity:.36;cursor:not-allowed}.hero{display:grid;grid-template-columns:1.15fr .85fr;align-items:center;gap:50px;min-height:calc(100vh - 180px)}.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.hero-visual{display:grid;place-items:center}.court-disc{width:min(100%,420px);aspect-ratio:1;border-radius:50%;background:var(--clay);position:relative;display:grid;place-items:center;box-shadow:var(--shadow);overflow:hidden}.court-disc:before{content:"";position:absolute;width:58%;height:80%;border:3px solid rgba(255,255,255,.72)}.court-disc:after{content:"";position:absolute;width:82%;border-top:3px solid rgba(255,255,255,.72)}.ball{z-index:1;width:132px;height:132px;border-radius:50%;background:var(--ball);color:var(--blue);display:grid;place-items:center;text-align:center;font-size:25px;font-weight:950;text-transform:uppercase;transform:rotate(-7deg);box-shadow:0 15px 38px rgba(0,0,0,.2)}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:25px}.profile-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.profile-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:0 7px 20px rgba(14,35,28,.05)}.profile-card .icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--accent);font-weight:950;font-size:22px}.profile-card h3{font-size:25px;text-transform:uppercase;margin:14px 0 5px;color:var(--blue)}.profile-card .star{font-weight:800;color:var(--accent);font-size:13px}.profile-card p{font-size:14px;color:#435048}.profile-card .motto{font-style:italic;color:var(--ink)}
.quiz-wrap{max-width:760px;margin:auto}.progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden;margin:10px 0 27px}.progress i{display:block;height:100%;background:var(--clay);transition:.25s}.qtag{display:inline-block;background:var(--clay-soft);color:var(--clay2);padding:5px 10px;border-radius:99px;font-size:11px;text-transform:uppercase;font-weight:900}.qtitle{font-size:clamp(28px,5vw,42px);line-height:1.08;color:var(--blue);font-weight:850;margin:13px 0 20px}.answers{display:grid;gap:9px}.answer{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:13px 15px;text-align:left;display:flex;align-items:center;gap:12px;color:var(--ink)}.answer:hover,.answer[aria-pressed="true"]{border-color:var(--clay);background:var(--clay-soft)}.key{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue);font-weight:900}.answer[aria-pressed="true"] .key{background:var(--clay);color:#fff}.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}.sheet-head{padding:28px;background:var(--tint);display:grid;grid-template-columns:90px 1fr;gap:20px;align-items:center}.sheet-icon{width:90px;height:90px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--accent);font-size:38px;font-weight:950}.sheet-head h2{color:var(--accent);margin:3px 0}.sheet-body{padding:28px;display:grid;grid-template-columns:1.05fr .95fr;gap:34px}.box{background:var(--cream);border-radius:14px;padding:16px}.box+.box{margin-top:12px}.box h3{font-size:15px;text-transform:uppercase;color:var(--blue);margin-bottom:9px}.box ul{padding-left:18px;margin:0}.prompt{font-size:14px;background:#fff;border:1px solid var(--line);padding:12px;border-radius:10px}.profile-picker{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:18px}.profile-picker button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;color:var(--muted)}.profile-picker button.active{background:var(--blue);color:#fff;border-color:var(--blue)}
.room-top{display:flex;justify-content:space-between;gap:16px;align-items:end;flex-wrap:wrap}.live-pill{padding:7px 11px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:11px;font-weight:900;text-transform:uppercase}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:23px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px}.kpi b{display:block;font-size:34px;color:var(--blue);line-height:1}.kpi span{font-size:12px;color:var(--muted)}.room-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:20px}.bar{display:grid;grid-template-columns:145px 1fr 55px;align-items:center;gap:10px;margin:11px 0;font-size:13px}.track{height:15px;background:var(--cream);border-radius:99px;overflow:hidden}.track i{display:block;height:100%;border-radius:99px}.room-note{font-size:12px;color:var(--muted);margin-top:18px}.admin{margin-top:16px}.admin summary{cursor:pointer;font-weight:850}.admin textarea{width:100%;min-height:100px;margin-top:10px;border:1px solid var(--line);border-radius:10px;padding:10px}.footer{padding:20px 0 35px;border-top:1px solid var(--line);font-size:11px;color:var(--muted);text-align:center}
@media(max-width:900px){.hero,.sheet-body,.room-grid{grid-template-columns:1fr}.profile-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{min-height:auto}.hero-visual{margin-top:10px}.kpis{grid-template-columns:1fr 1fr 1fr}}
@media(max-width:680px){.shell{width:min(100% - 22px,1120px)}.top{min-height:68px}.brand small{display:none}.mobile-menu{display:block}.menu{display:none;position:absolute;z-index:10;right:0;top:62px;background:#fff;box-shadow:var(--shadow);padding:8px;border-radius:15px;flex-direction:column;align-items:stretch}.menu.open{display:flex}.menu button{text-align:left}.view{padding:28px 0 45px}.hero{gap:24px}.lead{font-size:16px}.court-disc{width:min(82vw,340px)}.profile-grid{grid-template-columns:1fr}.section-head{align-items:start;flex-direction:column}.qnav{flex-direction:column-reverse}.qnav .btn{width:100%}.sheet-head{grid-template-columns:64px 1fr;padding:20px}.sheet-icon{width:64px;height:64px;font-size:28px}.sheet-body{padding:17px;gap:15px}.kpis{grid-template-columns:1fr}.bar{grid-template-columns:105px 1fr 48px;font-size:12px}.profile-picker{display:grid;grid-template-columns:1fr 1fr}.profile-picker button{font-size:12px}.hero-actions .btn{width:100%}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head><body>
<header class="shell top"><div class="brand"><div class="logo">FFT</div><div><b>Profils enseignants</b><small>Animation de conférence</small></div></div><button class="mobile-menu" id="mobileMenu" aria-expanded="false">Menu</button><nav class="menu" id="menu" aria-label="Navigation"><button data-view="home">Accueil</button><button data-view="profiles">Les profils</button><button data-view="quiz">Questionnaire</button><button data-view="sheet">Ma fiche</button><button data-view="room">La salle</button></nav></header>
<main class="shell" id="app"></main>
<footer class="shell footer">Questionnaire d'animation, sans valeur d'évaluation professionnelle ou psychométrique. Les personnalités citées servent uniquement de références illustratives. Version de démonstration.</footer>
<script>
const F={court:{name:"Sur le court",accent:"#bd5a35",tint:"#f6e3da"},club:{name:"Autour du court",accent:"#315d98",tint:"#e2eaf5"},traj:{name:"Trajectoires",accent:"#39704d",tint:"#e3efe7"}};
const P={P:{name:"Le Passeur",star:"Yannick Noah",fam:"court",motto:"Ma fierté, c'est de les voir progresser.",portrait:"Vous vivez pour le déclic d'un joueur et la progression du groupe.",forces:["Pédagogie et patience","Animation de groupe","Confiance avec les familles"],pains:["Groupes hétérogènes","Préparation des séances","Suivi individuel"],ia:["Différencier les séances","Créer des jeux pédagogiques","Préparer les messages aux familles"],prompt:"Prépare une séance d'une heure pour huit enfants, niveau orange, objectif service, avec trois jeux progressifs."},C:{name:"Le Coach de compétition",star:"Novak Djokovic",fam:"court",motto:"Le terrain donne des repères concrets.",portrait:"Vous recherchez la progression mesurable, la précision et la performance.",forces:["Expertise technique","Analyse tactique","Exigence"],pains:["Individualiser","Analyser les matchs","Planifier la charge"],ia:["Plans individualisés","Synthèse de notes de match","Routines mentales"],prompt:"À partir de mes notes de match, identifie trois axes de travail et propose un cycle de quatre semaines."},B:{name:"Le Bâtisseur",star:"Amélie Mauresmo",fam:"club",motto:"Je fais avancer le projet du club.",portrait:"Vous coordonnez les personnes, les priorités et les projets collectifs.",forces:["Vision d'ensemble","Organisation","Coordination"],pains:["Charge administrative","Multiplicité des attentes","Priorisation"],ia:["Plans d'action","Comptes rendus","Tableaux de bord"],prompt:"Transforme ces informations en plan d'action de club avec étapes, responsables et échéances."},E:{name:"L'Entrepreneur",star:"Serena Williams",fam:"club",motto:"Une idée utile doit devenir une offre claire.",portrait:"Vous développez l'activité, les offres et la relation avec vos publics.",forces:["Autonomie","Sens du service","Création d'offres"],pains:["Remplir les créneaux","Communication","Suivi administratif"],ia:["Offres de stages","Textes de communication","Relances"],prompt:"Crée trois offres de stage pour adultes débutants avec programme et texte de présentation."},J:{name:"Le Jeune Pro",star:"Carlos Alcaraz",fam:"traj",motto:"J'apprends en testant.",portrait:"Curieux et connecté, vous construisez votre style en expérimentant.",forces:["Énergie","Curiosité","Aisance numérique"],pains:["Construire son répertoire","Gérer les situations difficiles","Organiser son temps"],ia:["Banque d'exercices","Simulation de situations","Aide à la formation"],prompt:"Propose cinq variantes d'un exercice de service, du niveau débutant au niveau confirmé."},S:{name:"Le Sage",star:"Roger Federer",fam:"traj",motto:"L'expérience aide à aller à l'essentiel.",portrait:"Vous privilégiez les repères solides, la simplicité et la transmission.",forces:["Expérience","Recul","Transmission"],pains:["Outils complexes","Paperasse","Formalisation du savoir"],ia:["Mettre au propre le savoir","Dicter plutôt qu'écrire","Créer des fiches équipe"],prompt:"Transforme ma description orale du revers en fiche pédagogique claire d'une page."}};
const K=Object.keys(P),Q=[
["Votre métier","Votre meilleur moment de la semaine ?",[["Un joueur qui réussit enfin",{P:1}],["Un objectif atteint en match",{C:1}],["Un projet de club qui avance",{B:1}],["Une activité qui se remplit",{E:1}],["Une nouvelle séance réussie",{J:1}],["Un conseil transmis à un collègue",{S:1}]]],
["Votre métier","Ce qui vous prend le plus de temps hors du court ?",[["Préparer les séances",{P:1}],["Analyser et planifier",{C:1}],["Gérer projets et réunions",{B:1}],["Communiquer et organiser",{E:1}],["Me former et chercher des idées",{J:1}],["La paperasse",{S:1}]]],
["Votre posture","Votre légitimité vient d'abord de…",[["Ma pédagogie",{P:1}],["Mon expertise de jeu",{C:1}],["Ma capacité à organiser",{B:1}],["Ma relation avec les publics",{E:1}],["Mon envie d'apprendre",{J:1}],["Mon expérience",{S:1}]]],
["Votre public","Vous préférez accompagner…",[["Les groupes de jeunes",{P:1}],["Les compétiteurs",{C:1}],["Le club dans son ensemble",{B:1}],["Les adultes et stages",{E:1}],["Des publics variés",{J:1}],["Les pratiquants fidèles",{S:1}]]],
["Votre temps","Avec deux heures libres, vous…",[["Inventez de nouveaux jeux",{P:1}],["Analysez des matchs",{C:1}],["Avancez un projet",{B:1}],["Créez une offre",{E:1}],["Testez un outil",{J:1}],["Formalisez votre expérience",{S:1}]]],
["Votre parcours","Où en êtes-vous dans le métier ?",[["Je débute ou suis en formation",{J:2}],["Je construis mon style",{P:1,C:1}],["J'ai pris des responsabilités",{B:1,E:1}],["J'ai une longue expérience",{S:2}]]],
["Le changement","Face à un nouvel outil, vous…",[["L'essayez s'il aide les élèves",{P:1}],["Demandez des résultats fiables",{C:1}],["Regardez son intérêt collectif",{B:1}],["Mesurez sa valeur",{E:1}],["Le testez immédiatement",{J:1}],["Attendez une preuve simple",{S:1}]]],
["Votre devise","La phrase qui vous ressemble ?",[["Chaque joueur peut progresser",{P:1}],["Les détails font la différence",{C:1}],["Un projet clair rassemble",{B:1}],["Une idée doit devenir une action",{E:1}],["On apprend en essayant",{J:1}],["L'expérience va à l'essentiel",{S:1}]]],
["Vous et l'IA","Aujourd'hui, l'IA et vous ?",[["Jamais essayé",{}],["Testée une ou deux fois",{}],["Utilisée ponctuellement",{}],["Utilisée chaque semaine",{}],["Utilisée presque chaque jour",{}]]],
["Vous et l'IA","Quel usage vous attire le plus ?",[["Adapter les séances",{P:.5}],["Analyser la progression",{C:.5}],["Piloter un projet",{B:.5}],["Créer des communications",{E:.5}],["Trouver de nouvelles idées",{J:.5}],["Formaliser mon savoir",{S:.5}]]]
];
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const S={view:location.hash.slice(1)||"home",step:0,ans:Array(Q.length).fill(null),result:store.get("fft-current",null),history:store.get("fft-history",[]),room:store.get("fft-room",[])};const app=document.getElementById("app"),menu=document.getElementById("menu");
function vars(k){const f=F[P[k].fam];return `--accent:${f.accent};--tint:${f.tint}`}
function nav(v){S.view=v;location.hash=v;document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-current",b.dataset.view===v?"page":"false"));menu.classList.remove("open");render();scrollTo({top:0})}
function home(){return `<section class="view hero"><div><div class="eyebrow">Colloque des enseignants</div><h1>Quel profil <span>tennis</span> êtes-vous ?</h1><p class="lead">10 questions, une fiche claire, puis retour immédiat à la conférence. Répondez spontanément.</p><div class="hero-actions"><button class="btn primary" data-go="quiz">Commencer</button><button class="btn secondary" data-go="profiles">Voir les 6 profils</button></div></div><div class="hero-visual"><div class="court-disc"><div class="ball">Votre<br>profil</div></div></div></section>`}
function profiles(){return `<section class="view"><div class="section-head"><div><div class="eyebrow">Repères</div><h2>Les 6 profils</h2><p class="lead">Des descriptions courtes pour comprendre les grandes façons d'exercer le métier.</p></div><button class="btn primary" data-go="quiz">Faire le questionnaire</button></div><div class="profile-grid">${K.map(k=>{const p=P[k],f=F[p.fam];return `<article class="profile-card" style="${vars(k)}"><div class="icon">${k}</div><h3>${p.name}</h3><div class="star">Esprit ${p.star} · ${f.name}</div><p class="motto">« ${p.motto} »</p><p>${p.portrait}</p></article>`}).join("")}</div></section>`}
function quiz(){const q=Q[S.step],sel=S.ans[S.step],letters="ABCDEF";return `<section class="view quiz-wrap"><div class="section-head"><div><div class="eyebrow">Question ${S.step+1} sur ${Q.length}</div></div><span class="eyebrow">Répondez spontanément</span></div><div class="progress"><i style="width:${(S.step+(sel!=null?1:0))/Q.length*100}%"></i></div><span class="qtag">${q[0]}</span><div class="qtitle">${q[1]}</div><div class="answers">${q[2].map((a,i)=>`<button class="answer" data-answer="${i}" aria-pressed="${sel===i}"><span class="key">${letters[i]}</span>${a[0]}</button>`).join("")}</div><div class="qnav"><button class="btn secondary" data-prev ${S.step===0?"disabled":""}>Précédent</button><button class="btn clay" data-next ${sel==null?"disabled":""}>${S.step===Q.length-1?"Voir ma fiche":"Suivant"}</button></div></section>`}
function compute(){const score=Object.fromEntries(K.map(k=>[k,0]));Q.forEach((q,i)=>{const a=q[2][S.ans[i]];if(a)Object.entries(a[1]).forEach(([k,v])=>score[k]+=v)});const order=K.slice().sort((a,b)=>score[b]-score[a]||K.indexOf(a)-K.indexOf(b));return {persona:order[0],second:order[1],at:Date.now()}}
function sheet(k=S.result?.persona){if(!k)return `<section class="view"><div class="section-head"><div><h2>Ma fiche</h2><p class="lead">Aucune fiche enregistrée sur cet appareil.</p></div><button class="btn primary" data-go="quiz">Commencer</button></div></section>`;const p=P[k],f=F[p.fam];return `<section class="view"><div class="section-head"><div><div class="eyebrow">Résultats enregistrés sur cet appareil</div><h2>Ma fiche</h2></div><button class="btn secondary" data-go="quiz">Refaire</button></div>${S.history.length?`<div class="profile-picker">${[...new Set(S.history.map(x=>x.persona))].map(x=>`<button data-sheet="${x}" class="${x===k?'active':''}">${P[x].name}</button>`).join("")}</div>`:""}<article class="sheet" style="${vars(k)}"><div class="sheet-head"><div class="sheet-icon">${k}</div><div><div class="eyebrow">${f.name}</div><h2>${p.name}</h2><p>Personnalité miroir : <b>${p.star}</b></p><p><i>« ${p.motto} »</i></p></div></div><div class="sheet-body"><div><div class="box"><h3>Votre portrait</h3><p>${p.portrait}</p></div><div class="box"><h3>Vos forces</h3><ul>${p.forces.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="box"><h3>Vos points d'attention</h3><ul>${p.pains.map(x=>`<li>${x}</li>`).join("")}</ul></div></div><div><div class="box"><h3>Ce que l'IA peut faire pour vous</h3><ul>${p.ia.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="box"><h3>Votre prompt signature</h3><div class="prompt">${p.prompt}</div><button class="btn secondary" data-copy style="margin-top:10px">Copier</button></div><div class="box"><h3>Profil secondaire</h3><p><b>${P[S.result?.second||k].name}</b></p></div></div></div></article></section>`}
function sample(){return ["P","P","P","P","P","C","C","C","B","B","E","E","J","J","J","S"].map(persona=>({persona}))}
function room(){const rows=S.room.length?S.room:sample(),demo=!S.room.length,n=rows.length,counts=Object.fromEntries(K.map(k=>[k,rows.filter(r=>r.persona===k).length])),max=Math.max(...Object.values(counts),1),top=K.slice().sort((a,b)=>counts[b]-counts[a])[0];return `<section class="view"><div class="room-top"><div><div class="eyebrow">Vue animateur</div><h2>La salle</h2></div><span class="live-pill">${demo?"Données de démonstration":"Résultats anonymes locaux"}</span></div><div class="kpis"><div class="kpi"><b>${n}</b><span>réponses affichées</span></div><div class="kpi"><b>${P[top].name.replace(/^Le |^L'/,"")}</b><span>profil majoritaire</span></div><div class="kpi"><b>${Math.round(counts[top]/n*100)}%</b><span>part du profil majoritaire</span></div></div><div class="room-grid"><div class="panel"><h3>Répartition des profils</h3>${K.sort((a,b)=>counts[b]-counts[a]).map(k=>`<div class="bar"><span>${P[k].name}</span><span class="track"><i style="width:${counts[k]/max*100}%;background:${F[P[k].fam].accent}"></i></span><b>${counts[k]}</b></div>`).join("")}</div><div class="panel"><h3>Lecture rapide</h3><p>Le profil le plus présent est <b>${P[top].name}</b>. Utilisez cette vue quelques instants pour rebondir, puis revenez à votre prise de parole.</p><p class="room-note">Cette première version agrège les réponses enregistrées dans le navigateur utilisé pour la démonstration. Pour un vrai temps réel entre plusieurs téléphones, il faudra connecter le site à une base de données ou importer les réponses d'un formulaire.</p><details class="admin"><summary>Outils de démonstration</summary><div class="hero-actions"><button class="btn secondary" data-add-current ${S.result?'':'disabled'}>Ajouter ma fiche aux résultats locaux</button><button class="btn secondary" data-clear-room>Vider les résultats locaux</button></div></details></div></div></section>`}
function render(){app.innerHTML=S.view==="profiles"?profiles():S.view==="quiz"?quiz():S.view==="sheet"?sheet():S.view==="room"?room():home();document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-current",b.dataset.view===S.view?"page":"false"))}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>nav(b.dataset.view));document.getElementById("mobileMenu").onclick=e=>{menu.classList.toggle("open");e.currentTarget.setAttribute("aria-expanded",menu.classList.contains("open"))};app.onclick=async e=>{const t=e.target.closest("button");if(!t)return;if(t.dataset.go){nav(t.dataset.go);return}if(t.dataset.answer!=null){S.ans[S.step]=+t.dataset.answer;render();return}if(t.hasAttribute("data-prev")){S.step=Math.max(0,S.step-1);render();return}if(t.hasAttribute("data-next")){if(S.ans[S.step]==null)return;if(S.step<Q.length-1){S.step++;render()}else{S.result=compute();S.history=[S.result,...S.history.filter(x=>x.persona!==S.result.persona)].slice(0,6);store.set("fft-current",S.result);store.set("fft-history",S.history);nav("sheet")}return}if(t.dataset.sheet){app.innerHTML=sheet(t.dataset.sheet);return}if(t.hasAttribute("data-copy")){try{await navigator.clipboard.writeText(P[S.result.persona].prompt);t.textContent="Copié ✓"}catch{t.textContent="Sélectionnez le texte"}return}if(t.hasAttribute("data-add-current")&&S.result){S.room.push({persona:S.result.persona,at:Date.now()});store.set("fft-room",S.room);render();return}if(t.hasAttribute("data-clear-room")){S.room=[];store.set("fft-room",[]);render();return}};window.addEventListener("hashchange",()=>{const v=location.hash.slice(1);if(["home","profiles","quiz","sheet","room"].includes(v)){S.view=v;render()}});if(!["home","profiles","quiz","sheet","room"].includes(S.view))S.view="home";render();
</script></body></html>
