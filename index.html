<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profils enseignants FFT</title><style>
:root{--clay:#d35220;--green:#033629;--cream:#f6f2e9;--ink:#1b211d;--blue:#253384;--ball:#dbe741;--line:#d9ddd7;--shadow:0 24px 70px #102c2240}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--cream);color:var(--ink)}button{font:inherit}.top{height:72px;position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;background:var(--green);color:white}.brand{font-weight:900;text-transform:uppercase;letter-spacing:.06em}.nav{display:flex;gap:5px}.nav button{border:0;background:transparent;color:white;padding:10px 13px;font-weight:800}.nav button[aria-current=page]{border-bottom:3px solid var(--clay)}.view{min-height:calc(100vh - 72px);padding:48px 5vw;background:linear-gradient(#033629e5,#033629f4),url('https://commons.wikimedia.org/wiki/Special:FilePath/Court%20Philippe-Chatrier%2012.jpg');background-size:cover;background-position:center}.profiles{background:var(--cream)}h1,h2,h3{margin-top:0}.hero h1{font-size:clamp(48px,7vw,96px);line-height:.87;text-transform:uppercase;color:var(--green);margin-bottom:16px}.hero h1 span{color:var(--clay)}.hero p{max-width:760px;font-size:18px}.btn{border:0;padding:13px 20px;font-weight:900;background:var(--clay);color:white}.secondary{background:white;color:var(--green);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}.pcard{background:white;border:1px solid var(--line);min-height:350px;padding:22px;position:relative;overflow:hidden}.pcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}.pcard h2{font-size:28px;text-transform:uppercase;margin:12px 0 4px}.star{color:var(--clay);font-weight:900}.quizbox,.result{max-width:960px;margin:auto;background:#fff;padding:clamp(20px,5vw,54px);box-shadow:var(--shadow);position:relative}.meta{display:flex;justify-content:space-between;color:#68746d;font-size:11px;font-weight:900;text-transform:uppercase}.progress{height:6px;background:#e4e7e2;margin:14px 0 27px}.progress i{display:block;height:100%;background:var(--clay)}.q{font-size:clamp(30px,5vw,52px);line-height:1.04;color:var(--green);font-weight:850;margin:12px 0 24px}.answers{display:grid;gap:10px}.answer{border:1.5px solid var(--line);background:white;padding:13px 15px;display:flex;gap:13px;align-items:center;text-align:left;transition:border-color .18s,background .18s}.answer:hover,.answer.sel{border-color:var(--clay);background:#fff8f4}.tennis{width:39px;height:39px;flex:none;border-radius:50%;background:var(--ball);display:grid;place-items:center;color:var(--green);font-weight:950;position:relative;overflow:hidden}.tennis:before,.tennis:after{content:"";position:absolute;width:31px;height:31px;border:2px solid white;border-top-color:transparent;border-bottom-color:transparent;border-radius:50%}.tennis:before{left:-22px}.tennis:after{right:-22px}.qnav{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.result-head{display:grid;grid-template-columns:230px 1fr;gap:25px}.result-head img{width:230px;height:290px;object-fit:cover}.result h1{font-size:52px;color:var(--green);text-transform:uppercase;margin:5px 0}.code{font-size:28px;font-weight:900;color:var(--clay)}.scoregrid,.dimgrid,.detailgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.card{background:var(--cream);padding:15px}.card b{display:block;color:var(--green)}.bar{height:10px;background:#ddd;margin-top:8px}.bar i{display:block;height:100%;background:var(--clay)}.full{grid-column:1/-1}.note{font-size:12px;color:#66736c}.footer{background:var(--green);color:#ffffff99;padding:18px;text-align:center;font-size:11px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.result-head{grid-template-columns:1fr}.result-head img{width:100%;height:380px}.scoregrid,.dimgrid,.detailgrid{grid-template-columns:1fr}}@media(max-width:600px){.top{height:auto;min-height:64px;align-items:flex-start;padding:12px}.nav{display:grid;grid-template-columns:1fr 1fr}.nav button{padding:7px}.view{padding:27px 11px}.grid{grid-template-columns:1fr}.hero h1{font-size:52px}.qnav{flex-direction:column-reverse}.qnav .btn{width:100%}}
</style></head><body><header class="top"><div class="brand">Profils enseignants FFT</div><nav class="nav"><button data-v="profiles">Profils</button><button data-v="quiz">Questionnaire</button><button data-v="result">Ma fiche</button><button data-v="room">La salle</button></nav></header><main id="app"></main><footer class="footer">Outil ludique, pas un test psychométrique validé. Aucun nom ni e-mail demandé.</footer><script>const R={"profils": {"P": {"n": "Le Passeur", "fam": "court", "star": "Yannick Noah", "dev": "Ma fierté, c’est de les voir progresser.", "portrait": "Cœur de l’école de tennis, du baby au tennis ado. Vous vivez pour le déclic d’un enfant qui réussit son premier service.", "forces": ["Pédagogie et patience", "Sens du jeu et de l’animation", "Lien de confiance avec les familles"], "pains": ["Préparer des séances variées pour des groupes hétérogènes", "Répondre aux parents", "Suivre la progression de dizaines d’enfants"], "ia": ["Séances différenciées par niveau en 2 minutes", "Jeux pédagogiques et variantes", "Messages aux parents et bilans de trimestre"], "prompt": "Prépare une séance d’1 h pour 8 enfants de 7-8 ans, niveau orange, objectif : le service. Propose 3 jeux et une variante pour les plus avancés.", "why": "Joie de jouer, énergie de groupe et transmission.", "anchor": "87 % des enseignants encadrent l’école de tennis et 68 % le mini-tennis.", "v": {"t": -0.8, "x": 0.4, "g": -0.8}, "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Yannick%20Noah%20%28Roland%20Garros%202023%29%2001.jpg"}, "C": {"n": "Le Coach de compétition", "fam": "court", "star": "Novak Djokovic", "dev": "Sur le court, c’est le résultat qui parle.", "portrait": "Vous entraînez les compétiteurs, jeunes et adultes. Votre légitimité vient de votre niveau de jeu et de votre œil technique.", "forces": ["Expertise technique et tactique", "Exigence et sens de la performance", "Crédibilité de joueur"], "pains": ["Individualiser l’entraînement", "Analyser les matchs", "Planifier la saison et la charge"], "ia": ["Plans d’entraînement individualisés", "Analyse de notes et de statistiques de match", "Routines de préparation mentale"], "prompt": "Voici mes notes sur le dernier match de mon joueur de 15 ans. Identifie 3 axes de travail et propose un cycle de 4 semaines.", "why": "Préparation millimétrée, souci du détail et recherche de performance.", "anchor": "55 % encadrent un centre d’entraînement jeunes.", "v": {"t": -0.6, "x": -0.4, "g": 0.8}, "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Novak%20Djokovic%20French%20Open%202015.jpg"}, "B": {"n": "Le Bâtisseur", "fam": "club", "star": "Amélie Mauresmo", "dev": "Je fais tourner le club.", "portrait": "Responsable pédagogique ou directeur sportif, vous portez le projet de club, les relations avec la mairie et les programmes fédéraux.", "forces": ["Vision d’ensemble", "Organisation et coordination d’équipe", "Relais entre bénévoles, fédération et collectivité"], "pains": ["Le temps administratif pris sur le court", "Dossiers de subvention et reporting", "Les attentes multiples des dirigeants bénévoles"], "ia": ["Dossiers de subvention et projet sportif", "Comptes rendus de réunion", "Plannings et tableaux de bord"], "prompt": "À partir de ces chiffres d’effectifs, rédige la partie « projet sportif » du dossier de subvention municipale, en 1 page.", "why": "Expérience de joueuse, de capitaine, d’entraîneure et de dirigeante.", "anchor": "Rôles de gestionnaire de projets et de relais fédéral identifiés dans 12 clubs.", "v": {"t": 0.9, "x": -0.2, "g": -0.6}, "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Amelie%20Mauresmo%20%2814235857599%29.jpg"}, "E": {"n": "L’Entrepreneur", "fam": "club", "star": "Serena Williams", "dev": "Mon planning, c’est mon chiffre d’affaires.", "portrait": "Salarié et libéral à la fois, souvent sur plusieurs clubs. Vous gérez votre clientèle de cours particuliers et de stages.", "forces": ["Sens du service et de la relation client", "Autonomie", "Capacité à créer de nouvelles offres"], "pains": ["Se rendre visible et remplir les créneaux", "Facturation et relances", "Le cadre juridique club / indépendant"], "ia": ["Offres de stages et textes pour les réseaux", "Relances et messages clients", "Grilles tarifaires et modèles à faire valider"], "prompt": "Crée 3 offres de stage de vacances pour adultes débutants, avec un texte Instagram et un message WhatsApp pour chacune.", "why": "Performance sportive prolongée par une trajectoire entrepreneuriale.", "anchor": "Environ 45 % ont une part d’activité libérale et 26 % travaillent dans plusieurs structures.", "v": {"t": 0.7, "x": 0.7, "g": 0.7}, "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Serena%20Williams%20at%202013%20US%20Open.jpg"}, "J": {"n": "Le Jeune Pro", "fam": "traj", "star": "Moïse Kouamé", "dev": "J’apprends tous les jours.", "portrait": "En début de carrière, en formation ou tout juste diplômé. Curieux, connecté, vous construisez votre style.", "forces": ["Énergie et curiosité", "Aisance avec le numérique", "Envie de se former"], "pains": ["Constituer son répertoire d’exercices", "Gérer un groupe ou un parent difficile", "Des horaires morcelés"], "ia": ["Tuteur de révision pour le DE", "Banque d’exercices commentés", "Entraînement aux situations difficiles"], "prompt": "Joue un parent mécontent que son enfant ne passe pas en groupe compétition. Je m’entraîne à lui répondre.", "why": "Une trajectoire de progression et d’apprentissage permanent.", "anchor": "30 % des enseignants ont 18-30 ans, dont 69 % avec un projet diplômant.", "v": {"t": -0.3, "x": 0.9, "g": -0.2}, "img": "https://upload.wikimedia.org/wikipedia/commons/5/5f/Carlos_Alcaraz_2025_FO.jpg"}, "S": {"n": "Le Sage", "fam": "traj", "star": "Roger Federer", "dev": "J’ai tout vu passer. Montrez-moi que ça marche.", "portrait": "Plus de 20 ans de métier, pilier du club et mémoire des adhérents. Pragmatique, vous choisissez vos nouveautés.", "forces": ["Expérience et recul", "Fidélité des adhérents", "Transmission aux jeunes collègues"], "pains": ["Les outils qui font perdre du temps", "La paperasse", "Devoir tout réapprendre"], "ia": ["Mettre au propre votre savoir", "Dicter au lieu d’écrire", "Transmettre à l’équipe"], "prompt": "Je te dicte ma progression pour enseigner le revers à une main. Mets-la au propre en fiche d’une page pour mes jeunes collègues.", "why": "Élégance, calme et longévité : l’expérience au service du geste juste.", "anchor": "24 % ont 51 ans et plus, dont 79 % sans projet diplômant.", "v": {"t": -0.4, "x": -0.9, "g": 0.1}, "img": "https://commons.wikimedia.org/wiki/Special:FilePath/Roger%20Federer%202012%20Indian%20Wells.jpg"}}, "questions": [{"rubrique": "Votre métier", "texte": "Votre meilleur moment de la semaine ?", "reponses": [{"texte": "Le mercredi avec l’école de tennis", "points": {"P": 1}}, {"texte": "Un match gagné par un joueur que j’entraîne", "points": {"C": 1}}, {"texte": "Un projet de club qui aboutit", "points": {"B": 1}}, {"texte": "Un stage complet, réservé en quelques jours", "points": {"E": 1}}, {"texte": "Une nouvelle séance testée qui fonctionne", "points": {"J": 1}}, {"texte": "Un ancien élève qui revient me voir", "points": {"S": 1}}]}, {"rubrique": "Votre métier", "texte": "Ce qui vous prend le plus de temps hors du court ?", "reponses": [{"texte": "Préparer les séances et répondre aux parents", "points": {"P": 1}}, {"texte": "Analyser les matchs et planifier", "points": {"C": 1}}, {"texte": "Dossiers, réunions, plannings", "points": {"B": 1}}, {"texte": "Communication, réservations, facturation", "points": {"E": 1}}, {"texte": "Réviser et me former", "points": {"J": 1}}, {"texte": "La paperasse que je repousse", "points": {"S": 1}}]}, {"rubrique": "Votre métier", "texte": "Votre légitimité vient d’abord de…", "reponses": [{"texte": "Ma pédagogie", "points": {"P": 1}}, {"texte": "Mon niveau de jeu", "points": {"C": 1}}, {"texte": "Ma capacité à organiser", "points": {"B": 1}}, {"texte": "Ma clientèle fidèle", "points": {"E": 1}}, {"texte": "Mon envie d’apprendre", "points": {"J": 1}}, {"texte": "Mon expérience", "points": {"S": 1}}]}, {"rubrique": "Votre métier", "texte": "Votre public préféré ?", "reponses": [{"texte": "Les 5-12 ans", "points": {"P": 1}}, {"texte": "Les compétiteurs", "points": {"C": 1}}, {"texte": "Le club dans son ensemble", "points": {"B": 1}}, {"texte": "Les adultes, en cours particulier", "points": {"E": 1}}, {"texte": "Tous : je découvre encore", "points": {"J": 1}}, {"texte": "Les fidèles de toujours", "points": {"S": 1}}]}, {"rubrique": "Votre métier", "texte": "On vous offre 2 heures de libre par semaine. Vous…", "reponses": [{"texte": "Inventez de nouveaux jeux", "points": {"P": 1}}, {"texte": "Regardez des matchs à analyser", "points": {"C": 1}}, {"texte": "Avancez le projet du club", "points": {"B": 1}}, {"texte": "Lancez une nouvelle offre", "points": {"E": 1}}, {"texte": "Suivez une formation", "points": {"J": 1}}, {"texte": "Transmettez à un jeune collègue", "points": {"S": 1}}]}, {"rubrique": "Votre parcours", "texte": "Où en êtes-vous dans le métier ?", "reponses": [{"texte": "En formation, ou moins de 3 ans de métier", "points": {"J": 2}}, {"texte": "3 à 10 ans : je construis mon style", "points": {"P": 1, "C": 1}}, {"texte": "10 à 20 ans : j’ai pris des responsabilités", "points": {"B": 1, "E": 1}}, {"texte": "Plus de 20 ans : j’ai vu passer plusieurs générations", "points": {"S": 2}}]}, {"rubrique": "Votre métier", "texte": "Face à un nouvel outil, vous…", "reponses": [{"texte": "L’essayez s’il aide les enfants", "points": {"P": 1}}, {"texte": "Voulez d’abord des données fiables", "points": {"C": 1}}, {"texte": "Regardez s’il fait gagner du temps à l’équipe", "points": {"B": 1}}, {"texte": "Calculez ce qu’il rapporte", "points": {"E": 1}}, {"texte": "Foncez", "points": {"J": 1}}, {"texte": "Attendez qu’on vous montre que ça marche", "points": {"S": 1}}]}, {"rubrique": "Votre métier", "texte": "Votre devise ?", "reponses": [{"texte": "Chaque enfant progresse", "points": {"P": 1}}, {"texte": "Le terrain ne ment pas", "points": {"C": 1}}, {"texte": "Seul on va vite, ensemble on va loin", "points": {"B": 1}}, {"texte": "Mon créneau, ma valeur", "points": {"E": 1}}, {"texte": "Toujours en progrès", "points": {"J": 1}}, {"texte": "L’expérience avant tout", "points": {"S": 1}}]}, {"rubrique": "Vous et l’IA", "texte": "Aujourd’hui, l’IA (ChatGPT, Copilot, Gemini…) et vous ?", "reponses": [{"texte": "Je n’ai jamais essayé", "points": {}, "niveau_ia": 0}, {"texte": "J’ai testé une ou deux fois", "points": {}, "niveau_ia": 1}, {"texte": "Je l’utilise de temps en temps", "points": {}, "niveau_ia": 2}, {"texte": "Je l’utilise chaque semaine pour mon métier", "points": {}, "niveau_ia": 3}, {"texte": "Tous les jours, avec mes propres prompts", "points": {}, "niveau_ia": 4}]}, {"rubrique": "Vous et l’IA", "texte": "Pour quoi l’avez-vous déjà utilisée ?", "reponses": [{"texte": "Rien encore", "points": {}, "niveau_ia": 0}, {"texte": "Poser des questions générales", "points": {}, "niveau_ia": 1}, {"texte": "Rédiger des messages ou des posts", "points": {"E": 0.5}, "niveau_ia": 2}, {"texte": "Préparer des séances ou des plans d’entraînement", "points": {"P": 0.5, "C": 0.5}, "niveau_ia": 3}, {"texte": "Analyser des données, des vidéos ou automatiser", "points": {"C": 0.5, "B": 0.5}, "niveau_ia": 4}]}]};
const C=Object.keys(R.profils),L='ABCDEF',IA=['Découverte','Curieux','Utilisateur','Pratiquant','Moteur'];let S={v:location.hash.slice(1)||'profiles',i:0,a:Array(R.questions.length).fill(null),res:JSON.parse(localStorage.getItem('fft-v7-result')||'null')};const app=document.getElementById('app');function calc(){let score=Object.fromEntries(C.map(c=>[c,0])),levels=[];R.questions.forEach((q,i)=>{let r=q.reponses[S.a[i]];if(!r)return;Object.entries(r.points).forEach(([c,p])=>score[c]+=p);if(r.niveau_ia!==undefined)levels.push(r.niveau_ia)});let q3=R.questions[2].reponses[S.a[2]],depart=q3?Object.keys(q3.points)[0]:null,order=C.slice().sort((a,b)=>score[b]-score[a]||((b===depart)-(a===depart))||C.indexOf(a)-C.indexOf(b)),total=C.reduce((s,c)=>s+score[c],0)||1,d={};['t','x','g'].forEach(k=>{let m=C.reduce((s,c)=>s+score[c]*R.profils[c].v[k],0)/total;d[k]=Math.round((1-m)/2*100)});let code=[d.t>=50?'T':'K',d.x>=50?'R':'X',d.g>=50?'G':'I'].join('-'),ia=levels.length?Math.floor(levels.reduce((a,b)=>a+b,0)/levels.length+.5):0;return {profil:order[0],secondaire:order[1],scores:score,...d,code,ia}}function go(v){S.v=v;location.hash=v;render();scrollTo(0,0)}function profiles(){return `<section class="view profiles"><div class="hero"><h1>Quel profil <span>tennis</span> êtes-vous ?</h1><p>Une expérience moderne fondée sur les 10 questions et les règles de calcul du référentiel.</p><button class="btn" data-go="quiz">Entrer sur le court</button></div><div class="grid">${C.map(c=>{let p=R.profils[c],a={court:'#d35220',club:'#253384',traj:'#16805a'}[p.fam];return `<article class="pcard" style="--accent:${a}"><small>${p.fam.toUpperCase()}</small><h2>${p.n}</h2><div class="star">Esprit ${p.star}</div><p>« ${p.dev} »</p><p>${p.portrait}</p></article>`}).join('')}</div></section>`}function quiz(){let q=R.questions[S.i],sel=S.a[S.i];return `<section class="view"><div class="quizbox"><div class="meta"><span>Point ${S.i+1} sur ${R.questions.length}</span><span>${q.rubrique}</span></div><div class="progress"><i style="width:${(S.i+(sel!=null?1:0))/R.questions.length*100}%"></i></div><div class="q">${q.texte}</div><div class="answers">${q.reponses.map((r,i)=>`<button class="answer ${sel===i?'sel':''}" data-a="${i}"><span class="tennis">${L[i]}</span><span>${r.texte}</span></button>`).join('')}</div><div class="qnav"><button class="btn secondary" data-prev ${S.i===0?'disabled':''}>Rejouer le point précédent</button><button class="btn" data-next ${sel==null?'disabled':''}>${S.i===R.questions.length-1?'Découvrir mon profil':'Servir le point suivant'}</button></div></div></section>`}function result(){if(!S.res)return `<section class="view"><div class="result"><h1>Ma fiche</h1><p>Terminez le questionnaire pour afficher votre résultat.</p><button class="btn" data-go="quiz">Entrer sur le court</button></div></section>`;let r=S.res,p=R.profils[r.profil],p2=R.profils[r.secondaire],domin=(v,a,b)=>v>=50?`${a} ${v}%`:`${b} ${100-v}%`;return `<section class="view"><article class="result"><div class="result-head"><img src="${p.img}" alt=""><div><small>PROFIL PRINCIPAL</small><h1>${p.n}</h1><div class="code">${r.code} · IA ${IA[r.ia]}</div><p><b>Personnalité miroir :</b> ${p.star}</p><p>« ${p.dev} »</p><p>${p.portrait}</p></div></div><div class="scoregrid"><div class="card"><b>Profil secondaire</b>${p2.n}<br>${p2.star}</div><div class="card"><b>Maturité IA</b>${IA[r.ia]}</div><div class="card"><b>Code personnel</b>${r.code}</div>${C.map(c=>`<div class="card"><b>${R.profils[c].n}</b>Score ${r.scores[c]}</div>`).join('')}</div><div class="dimgrid"><div class="card"><b>Terrain ↔ Club</b>${domin(r.t,'Terrain','Club')}<div class="bar"><i style="width:${r.t}%"></i></div></div><div class="card"><b>Repères ↔ Exploration</b>${domin(r.x,'Repères','Exploration')}<div class="bar"><i style="width:${r.x}%"></i></div></div><div class="card"><b>Groupe ↔ Individuel</b>${domin(r.g,'Groupe','Individuel')}<div class="bar"><i style="width:${r.g}%"></i></div></div></div><div class="detailgrid"><div class="card"><b>Vos forces</b><ul>${p.forces.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><b>Ce qui vous pèse</b><ul>${p.pains.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><b>Ce que l’IA peut faire</b><ul>${p.ia.map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card full"><b>Pourquoi ${p.star}</b><p>${p.why}</p><b>Votre prompt signature</b><p>${p.prompt}</p><b>Ancrage</b><p>${p.anchor}</p><p class="note">Les pourcentages décrivent des tendances. Outil ludique, pas un test psychométrique validé.</p></div></div><button class="btn" data-restart>Refaire le questionnaire</button></article></section>`}function room(){return `<section class="view"><div class="result"><h1>La salle</h1><p>Cette étape sera reconnectée ensuite au mode de collecte retenu. Le calcul individuel complet est maintenant stabilisé.</p></div></section>`}function render(){app.innerHTML=S.v==='quiz'?quiz():S.v==='result'?result():S.v==='room'?room():profiles();document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-current',b.dataset.v===S.v?'page':'false'))}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));app.onclick=e=>{let t=e.target.closest('button');if(!t)return;if(t.dataset.go)return go(t.dataset.go);if(t.dataset.a!=null){S.a[S.i]=+t.dataset.a;render();return}if(t.hasAttribute('data-prev')){S.i=Math.max(0,S.i-1);render();return}if(t.hasAttribute('data-next')){if(S.a[S.i]==null)return;if(S.i<R.questions.length-1){S.i++;render()}else{S.res=calc();localStorage.setItem('fft-v7-result',JSON.stringify(S.res));go('result')}return}if(t.hasAttribute('data-restart')){S.i=0;S.a.fill(null);go('quiz')}};render();</script></body></html>
